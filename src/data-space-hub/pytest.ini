# pytest.ini
[pytest]
testpaths = tests
python_files = *_test.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests with mocks (no external dependencies)
    integration: Integration tests (may require Vault)
    slow: Slow running tests

# Coverage
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
    ; -p no:warnings
    ; --disable-warnings
    ; --cov=api/services
    ; --cov-report=html
    ; --cov-report=term-missing:skip-covered

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
norecursedirs = .git .tox dist build *.egg venv __pycache__
