- name: Create route for sage-dashboard
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: sage-dashboard
        namespace: "{{ k8s_namespace }}"
        annotations:
          haproxy.router.openshift.io/ip_whitelist: ''
      spec:
        host: "{{ sage_dashboard_address | regex_replace('^https?://', '') }}"
        to:
          kind: Service
          name: "{{ application }}-sagedashboard"
        port:
          targetPort: www
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow

- name: Create route for sage-dashboard-catalog-proxy
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: sage-dashboard-catalog-proxy
        namespace: "{{ k8s_namespace }}"
        annotations:
          haproxy.router.openshift.io/ip_whitelist: ''
      spec:
        host: "{{ sage_dashboard_address | regex_replace('^https?://', '') }}"
        path: /catalog-proxy
        to:
          kind: Service
          name: "{{ application }}-sagedashboard"
        port:
          targetPort: www
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow

- name: Create route for sage-dashboard-catalog
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: sage-dashboard-catalog
        namespace: "{{ k8s_namespace }}"
        annotations:
          haproxy.router.openshift.io/ip_whitelist: ''
      spec:
        host: "{{ sage_dashboard_address | regex_replace('^https?://', '') }}"
        path: /catalog
        to:
          kind: Service
          name: "{{ application }}-sagedashboard"
        port:
          targetPort: www
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow
