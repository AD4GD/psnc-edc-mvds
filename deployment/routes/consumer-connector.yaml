- name: Create route for consumer-connector-api
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: consumer-connector-api
        namespace: "{{ k8s_namespace }}"
        annotations:
          haproxy.router.openshift.io/ip_whitelist: ''
      spec:
        host: "{{ consumer_connector_address | regex_replace('^https?://', '') }}"
        path: /api
        to:
          kind: Service
          name: "{{ application }}-connectorconsumer"
        port:
          targetPort: api
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow

