- name: Create route for registration-service-backend-api
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: registration-service-backend-api
        namespace: "{{ k8s_namespace }}"
        annotations:
          haproxy.router.openshift.io/ip_whitelist: ''
      spec:
        host: "{{ registration_service_backend_address | regex_replace('^https?://', '') }}"
        path: /api
        to:
          kind: Service
          name: "{{ application }}-registrationservicebackend"
        port:
          targetPort: api
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow

- name: Create route for registration-service-backend-authority
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: registration-service-backend-authority
        namespace: "{{ k8s_namespace }}"
        annotations:
          haproxy.router.openshift.io/ip_whitelist: ''
      spec:
        host: "{{ registration_service_backend_address | regex_replace('^https?://', '') }}"
        path: /authority
        to:
          kind: Service
          name: "{{ application }}-registrationservicebackend"
        port:
          targetPort: authority
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow
