- name: Create route for consumer-dashboard
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: consumer-dashboard
        namespace: "{{ k8s_namespace }}"
      spec:
        host: "{{ consumer_dashboard_address | regex_replace('^https?://', '') }}"
        to:
          kind: Service
          name: "{{ application }}-consumerdashboard"
        port:
          targetPort: www
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow
