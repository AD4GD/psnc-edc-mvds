- name: Create route for dataspaceportal
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: dataspaceportal
        namespace: "{{ k8s_namespace }}"
      spec:
        host: "{{ data_space_portal_address | regex_replace('^https?://', '') }}"
        to:
          kind: Service
          name: "{{ application }}-dataspaceportal"
        port:
          targetPort: receiver
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow
