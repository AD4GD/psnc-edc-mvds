- name: Create route for registration-service-frontend
  k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: registration-service-frontend
        namespace: "{{ k8s_namespace }}"
        annotations:
          haproxy.router.openshift.io/ip_whitelist: ''
      spec:
        host: "{{ registration_service_frontend_address | regex_replace('^https?://', '') }}"
        to:
          kind: Service
          name: "{{ application }}-registrationservicefrontend"
        port:
          targetPort: www
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Allow
