- name: "deploy deployment/{{ application }}-identityprovider"
  tags:
    - identityprovider
    - deployment
  k8s:
    definition:
      apiVersion: v1
      kind: Deployment
      metadata:
        name: "{{ application }}-identityprovider"
        labels:
          component: identityprovider
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        revisionHistoryLimit: 0
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: identityprovider
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: identityprovider
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (identityprovider_configmap_digest + identityprovider_secret_digest)|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            ports:
              - name: "keycloak-https"
                containerPort: 8443
                protocol: "TCP"
              - name: "keycloak-http"
                containerPort: 8080
                protocol: "TCP"

            containers:
              - name: "identityprovider"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/identity-provider:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ identityprovider_resources }}"
                envFrom:
                  - configMapRef:
                      name: "{{ application }}-identityprovider"
                      optional: true
                  - secretRef:
                      name: "{{ application }}-identityprovider"
                      optional: true
                volumeMounts:
                  - name: "identityprovider-tmp"
                    mountPath: "/tmp"
            volumes:
              - name: "identityprovider-tmp"
                emptyDir:
                  medium: "Memory"

- name: "deploy service/{{ application }}-identityprovider"
  tags:
    - identityprovider
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-identityprovider"
        labels:
          application: "{{ application }}"
          component: identityprovider
      spec:
        ports:
          - name: "keycloak-https"
            port: 8443
          - name: "keycloak-http"
            port: 8080
        selector:
          application: "{{ application }}"
          component: identityprovider
      envFrom:
        - configMapRef:
            name: "{{ application }}-identityprovider"
            optional: true
        - secretRef:
            name: "{{ application }}-identityprovider"
            optional: true
