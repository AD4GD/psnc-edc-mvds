- name: "deploy secret/{{ application }}-connectorsage"
  tags:
    - connector
    - connectorsage
    - secret
  k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ application }}-connectorsage-jks"
        labels:
          application: "{{ application }}"
          component: connectorsage
      data:
        sage-daps.jks: "{{ lookup('file', 'certs/sage-daps.jks') | b64encode }}"

- name: "deploy deployment/{{ application }}-connectorsage"
  tags:
    - connector
    - connectorsage
    - deployment
  k8s:
    definition:
      apiVersion: v1
      kind: Deployment
      metadata:
        name: "{{ application }}-connectorsage"
        labels:
          component: connectorsage
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        revisionHistoryLimit: 0
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: connectorsage
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: connectorsage
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (connectorsage_configmap_digest + connectorsage_secret_digest)|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            ports:
              - name: "api"
                containerPort: 29191
                protocol: "TCP"
              - name: "management"
                containerPort: 29193
                protocol: "TCP"
              - name: "protocol"
                containerPort: 29194
                protocol: "TCP"
              - name: "catalogproxy"
                containerPort: 29195
                protocol: "TCP"
              - name: "public"
                containerPort: 29291
                protocol: "TCP"
              - name: "control"
                containerPort: 29192
                protocol: "TCP"
            containers:
              - name: "connectorsage"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/connector:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ connectorsage_resources }}"
                envFrom:
                  - configMapRef:
                      name: "{{ application }}-connectorsage"
                      optional: true
                  - secretRef:
                      name: "{{ application }}-connectorsage"
                      optional: true
                volumeMounts:
                  - name: "connectorsage-tmp"
                    mountPath: "/tmp"
                  - name: "jks-volume"
                    mountPath: "/certs"
            volumes:
              - name: "connectorsage-tmp"
                emptyDir:
                  medium: "Memory"
              - name: "jks-volume"
                secret:
                  secretName: "{{ application }}-connectorsage-jks"
                  items:
                    - key: "sage-daps.jks"
                      path: "sage-daps.jks"

- name: "deploy service/{{ application }}-connectorsage"
  tags:
    - connector
    - connectorsage
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-connectorsage"
        labels:
          application: "{{ application }}"
          component: connectorsage
      spec:
        ports:
          - name: "api"
            port: 29191
          - name: "management"
            port: 29193
          - name: "protocol"
            port: 29194
          - name: "catalogproxy"
            port: 29195
          - name: "public"
            port: 29291
          - name: "control"
            port: 29192
        selector:
          application: "{{ application }}"
          component: connectorsage
