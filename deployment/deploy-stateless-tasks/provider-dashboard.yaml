- name: Set app.config.json with auth
  set_fact:
    app_config_json: |
      {
        "managementApiUrl": "{{ provider_connector_address }}/management",
        "catalogUrl": "{{ provider_dashboard_address }}/catalog-proxy/catalog/request",
        "theme": "theme-3",
        "deploymentMode": "production",
        "backendUrl": "{{ consumer_backend_address }}/edr-endpoint",
        "oauthIssuer": "{{ provider_keycloak_address }}/realms/Organizations",
        "oauthClientId": "data-space-users"
      }
  when: is_auth

- name: Set app.config.json without auth
  set_fact:
    app_config_json: |
      {
        "managementApiUrl": "{{ provider_connector_address }}/management",
        "catalogUrl": "{{ provider_dashboard_address }}/catalog-proxy/catalog/request",
        "theme": "theme-3",
        "deploymentMode": "production",
        "backendUrl": "{{ consumer_backend_address }}/edr-endpoint"
      }
  when: not is_auth

- name: "deploy configmap/{{ application }}-providerdashboard"
  tags:
    - providerdashboard
    - configmap
  k8s:
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ application }}-providerdashboard-config"
        labels:
          application: "{{ application }}"
      data:
        app.config.json: "{{ app_config_json | to_nice_json }}"
        nginx.conf: |
          events {}
          pid /tmp/nginx.pid;
          http {
            include /etc/nginx/mime.types;
            server {
              listen 8080;
              server_name {{ provider_dashboard_address_shorten }};
              root /usr/share/nginx/html;
              index index.html;
              access_log off;
              location / {
                try_files $uri $uri/ /index.html;
              }
              location /management {
                proxy_pass {{ provider_connector_address }}/management;
              }
              location /catalog-proxy/ {
                proxy_pass {{ provider_connector_address }}/catalog-proxy/;
              }
              location /catalog {
                proxy_pass {{ provider_connector_address }}/catalog-proxy/catalog/request;
              }
            }
          }

- name: "deploy deployment/{{ application }}-providerdashboard"
  tags:
    - providerdashboard
    - deployment
  k8s:
    definition:
      apiVersion: v1
      kind: Deployment
      metadata:
        name: "{{ application }}-providerdashboard"
        labels:
          component: providerdashboard
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        revisionHistoryLimit: 0
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: providerdashboard
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: providerdashboard
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (providerdashboard_configmap_digest + providerdashboard_secret_digest)|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            ports:
              - name: "www"
                containerPort: 8080
                protocol: "TCP"
            containers:
              - name: "providerdashboard"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/data-dashboard:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ providerdashboard_resources }}"
                envFrom:
                  - secretRef:
                      name: "{{ application }}-providerdashboard"
                      optional: true
                  - configMapRef:
                      name: "{{ application }}-providerdashboard-config"
                      optional: true
                volumeMounts:
                  - name: "providerdashboard-tmp"
                    mountPath: "/tmp"
                  - name: "providerdashboard-nginx-config"
                    mountPath: "/etc/nginx/nginx.conf"
                    subPath: "nginx.conf"
                  - name: "providerdashboard-app-config"
                    mountPath: "/usr/share/nginx/html/assets/config/app.config.json"
                    subPath: "app.config.json"
            volumes:
              - name: "providerdashboard-tmp"
                emptyDir:
                  medium: "Memory"
              - name: "providerdashboard-nginx-config"
                configMap:
                  name: "{{ application }}-providerdashboard-config"
              - name: "providerdashboard-app-config"
                configMap:
                  name: "{{ application }}-providerdashboard-config"

- name: "deploy service/{{ application }}-providerdashboard"
  tags:
    - providerdashboard
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-providerdashboard"
        labels:
          application: "{{ application }}"
          component: providerdashboard
      spec:
        ports:
          - name: "www"
            port: 8080
        selector:
          application: "{{ application }}"
          component: providerdashboard
