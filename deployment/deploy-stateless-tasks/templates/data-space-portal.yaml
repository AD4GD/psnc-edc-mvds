
- name: "deploy configmap/{{ application }}-{{ component }}"
  tags:
    - "{{ component }}"
    - configmap
  k8s:
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ application }}-{{ component }}-config"
        labels:
          application: "{{ application }}"
      data:
        app.config.json: "{{ vars[component + '_app_config_obj'] | to_nice_json }}"

        nginx.conf: |
          events {}
          pid /tmp/nginx.pid;
          http {
            include /etc/nginx/mime.types;
            server {
              listen 8080;
              server_name {{ vars[component + '_address_shorten'] }};
              root /usr/share/nginx/html;
              index index.html;
              access_log off;

              # React SPA routing
              location / {
                try_files $uri $uri/ /index.html;
              }
            }
          }

- name: "deploy deployment/{{ application }}-{{ component }}"
  tags:
    - "{{ component }}"
    - deployment
  k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ application }}-{{ component }}"
        labels:
          component: "{{ component }}"
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        revisionHistoryLimit: "{{ initial_replicas }}"
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: "{{ component }}"
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: "{{ component }}"
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (vars[component + '_configmap_digest'] + vars[component + '_secret_digest'])|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            containers:
              - name: "{{ component }}"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/data-space-portal:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ vars[component + '_resources'] }}"
                envFrom:
                  - secretRef:
                      name: "{{ application }}-{{ component }}"
                      optional: true
                  - configMapRef:
                      name: "{{ application }}-{{ component }}-config"
                      optional: true
                ports:
                  - name: "www"
                    containerPort: 8080
                    protocol: "TCP"
                volumeMounts:
                  - name: "{{ component }}-tmp"
                    mountPath: "/tmp"
                  - name: "{{ component }}-nginx-config"
                    mountPath: "/etc/nginx/nginx.conf"
                    subPath: "nginx.conf"
                  - name: "{{ component }}-app-config"
                    mountPath: "/usr/share/nginx/html/app.config.json"
                    subPath: "app.config.json"
            volumes:
              - name: "{{ component }}-tmp"
                emptyDir:
                  medium: "Memory"
              - name: "{{ component }}-nginx-config"
                configMap:
                  name: "{{ application }}-{{ component }}-config"
              - name: "{{ component }}-app-config"
                configMap:
                  name: "{{ application }}-{{ component }}-config"

- name: "deploy service/{{ application }}-{{ component }}"
  tags:
    - "{{ component }}"
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-{{ component }}"
        labels:
          application: "{{ application }}"
          component: "{{ component }}"
      spec:
        ports:
          - name: "www"
            port: 8080
            targetPort: "www"
        selector:
          application: "{{ application }}"
          component: "{{ component }}"
