
- name: "deploy deployment/{{ application }}-connectorconsumer"
  tags:
    - connector
    - connectorconsumer
    - deployment
  k8s:
    definition:
      apiVersion: v1
      kind: Deployment
      metadata:
        name: "{{ application }}-connectorconsumer"
        labels:
          component: connectorconsumer
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: connectorconsumer
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: connectorconsumer
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (connectorconsumer_configmap_digest + connectorconsumer_secret_digest)|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            ports:
              - name: "api"
                containerPort: 8080
                protocol: "TCP"
              - name: "management"
                containerPort: 8081
                protocol: "TCP"
              - name: "dsp"
                containerPort: 8082
                protocol: "TCP"
              - name: "control"
                containerPort: 8083
                protocol: "TCP"
              - name: "catalog"
                containerPort: 8084
                protocol: "TCP"
              - name: "version"
                containerPort: 8085
                protocol: "TCP"
              - name: "public"
                containerPort: 11001
                protocol: "TCP"
            containers:
              - name: "connectorconsumer"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/connector:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ connectorconsumer_resources }}"
                envFrom:
                  - configMapRef:
                      name: "{{ application }}-connectorconsumer"
                      optional: true
                  - secretRef:
                      name: "{{ application }}-connectorconsumer"
                      optional: true
                volumeMounts:
                  - name: "connectorconsumer-tmp"
                    mountPath: "/tmp"
            volumes:
              - name: "connectorconsumer-tmp"
                emptyDir:
                  medium: "Memory"

- name: "deploy service/{{ application }}-connectorconsumer"
  tags:
    - connector
    - connectorconsumer
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-connectorconsumer"
        labels:
          application: "{{ application }}"
          component: connectorconsumer
      spec:
        ports:
          - name: "api"
            port: 8080
          - name: "management"
            port: 8081
          - name: "dsp"
            port: 8082
          - name: "control"
            port: 8083
          - name: "catalog"
            port: 8084
          - name: "version"
            port: 8085
          - name: "public"
            port: 11001
        selector:
          application: "{{ application }}"
          component: connectorconsumer
