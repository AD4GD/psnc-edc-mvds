- name: "deploy secret/{{ application }}-connectorconsumer"
  tags:
  - connector
  - connectorconsumer
  - secret
  k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ application }}-connectorconsumer-jks"
        labels:
          application: "{{ application }}"
          component: connectorconsumer
      data:
        consumer-daps.jks: "{{ lookup('file', 'certs/consumer-daps.jks') | b64encode }}"

- name: "deploy deployment/{{ application }}-connectorconsumer"
  tags:
    - connector
    - connectorconsumer
    - deployment
  k8s:
    definition:
      apiVersion: v1
      kind: Deployment
      metadata:
        name: "{{ application }}-connectorconsumer"
        labels:
          component: connectorconsumer
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        revisionHistoryLimit: 0
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: connectorconsumer
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: connectorconsumer
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (connectorconsumer_configmap_digest + connectorconsumer_secret_digest)|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            ports:
              - name: "api"
                containerPort: 29191
                protocol: "TCP"
              - name: "management"
                containerPort: 29193
                protocol: "TCP"
              - name: "protocol"
                containerPort: 29194
                protocol: "TCP"
              - name: "catalogproxy"
                containerPort: 29195
                protocol: "TCP"
              - name: "public"
                containerPort: 29291
                protocol: "TCP"
              - name: "control"
                containerPort: 29192
                protocol: "TCP"
            containers:
              - name: "connectorconsumer"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/connector:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ connectorconsumer_resources }}"
                envFrom:
                  - configMapRef:
                      name: "{{ application }}-connectorconsumer"
                      optional: true
                  - secretRef:
                      name: "{{ application }}-connectorconsumer"
                      optional: true
                volumeMounts:
                  - name: "connectorconsumer-tmp"
                    mountPath: "/tmp"
                  - name: "jks-volume"
                    mountPath: "/certs"
            volumes:
              - name: "connectorconsumer-tmp"
                emptyDir:
                  medium: "Memory"
              - name: "jks-volume"
                secret:
                  secretName: "{{ application }}-connectorconsumer-jks"
                  items:
                    - key: "consumer-daps.jks"
                      path: "consumer-daps.jks"

- name: "deploy service/{{ application }}-connectorconsumer"
  tags:
    - connector
    - connectorconsumer
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-connectorconsumer"
        labels:
          application: "{{ application }}"
          component: connectorconsumer
      spec:
        ports:
          - name: "api"
            port: 29191
          - name: "management"
            port: 29193
          - name: "protocol"
            port: 29194
          - name: "catalogproxy"
            port: 29195
          - name: "public"
            port: 29291
          - name: "control"
            port: 29192
        selector:
          application: "{{ application }}"
          component: connectorconsumer
