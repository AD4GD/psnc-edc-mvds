- name: "deploy secret/{{ application }}-connectorprovider"
  tags:
    - connector
    - connectorprovider
    - secret
  k8s:
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ application }}-connectorprovider-jks"
        labels:
          application: "{{ application }}"
          component: connectorprovider
      data:
        provider-daps.jks: "{{ lookup('file', 'certs/provider-daps.jks') | b64encode }}"

- name: "deploy deployment/{{ application }}-connectorprovider"
  tags:
    - connector
    - connectorprovider
    - deployment
  k8s:
    definition:
      apiVersion: v1
      kind: Deployment
      metadata:
        name: "{{ application }}-connectorprovider"
        labels:
          component: connectorprovider
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: connectorprovider
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: connectorprovider
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (connectorprovider_configmap_digest + connectorprovider_secret_digest)|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            ports:
              - name: "api"
                containerPort: 19191
                protocol: "TCP"
              - name: "management"
                containerPort: 19193
                protocol: "TCP"
              - name: "protocol"
                containerPort: 19194
                protocol: "TCP"
              - name: "public"
                containerPort: 19291
                protocol: "TCP"
              - name: "control"
                containerPort: 19192
                protocol: "TCP"
            containers:
              - name: "connectorprovider"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/connector:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ connectorprovider_resources }}"
                envFrom:
                  - configMapRef:
                      name: "{{ application }}-connectorprovider"
                      optional: true
                  - secretRef:
                      name: "{{ application }}-connectorprovider"
                      optional: true
                volumeMounts:
                  - name: "connectorprovider-tmp"
                    mountPath: "/tmp"
                  - name: "jks-volume"
                    mountPath: "/certs"
            volumes:
              - name: "connectorprovider-tmp"
                emptyDir:
                  medium: "Memory"
              - name: "jks-volume"
                secret:
                  secretName: "{{ application }}-connectorprovider-jks"
                  items:
                    - key: "provider-daps.jks"
                      path: "provider-daps.jks"

- name: "deploy service/{{ application }}-connectorprovider"
  tags:
    - connector
    - connectorprovider
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-connectorprovider"
        labels:
          application: "{{ application }}"
          component: connectorprovider
      spec:
        ports:
          - name: "api"
            port: 19191
          - name: "management"
            port: 19193
          - name: "protocol"
            port: 19194
          - name: "public"
            port: 19291
          - name: "control"
            port: 19192
        selector:
          application: "{{ application }}"
          component: connectorprovider
