---
- name: "Deploy sage-public edc connector"
  include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
  vars:
    image_name: connector
    component: sage-public-connector
    ports:
      - name: api
        containerPort: 8080
        protocol: TCP
      - name: management
        containerPort: 8081
        protocol: TCP
      - name: dsp
        containerPort: 8082
        protocol: TCP
      - name: control
        containerPort: 8083
        protocol: TCP
      - name: catalog
        containerPort: 8084
        protocol: TCP
      - name: version
        containerPort: 8085
        protocol: TCP
      - name: catalogproxy
        containerPort: 8086
        protocol: TCP
      - name: public
        containerPort: 11001
        protocol: TCP
    service_ports:
      - name: api
        port: 8080
      - name: management
        port: 8081
      - name: dsp
        port: 8082
      - name: control
        port: 8083
      - name: catalog
        port: 8084
      - name: version
        port: 8085
      - name: catalogproxy
        port: 8086
      - name: public
        port: 11001

- name: "Deploy sage-public edc identity hub"
  include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
  vars:
    image_name: identity-hub
    component: sage-public-identity-hub
    ports:
      - name: api
        containerPort: 7080
        protocol: TCP
      - name: credentials
        containerPort: 7081
        protocol: TCP
      - name: identity
        containerPort: 7082
        protocol: TCP
      - name: did
        containerPort: 7083
        protocol: TCP
      - name: version
        containerPort: 7085
        protocol: TCP
      - name: sts
        containerPort: 7086
        protocol: TCP

- name: "Deploy sage-public backend"
  include_tasks: deploy-stateless-tasks/templates/consumer-backend.yaml
  vars:
    component: sage-public-backend

- name: "Deploy sage-public dashboard"
  include_tasks: deploy-stateless-tasks/templates/connector-dashboard.yaml
  vars:
    component: sage-public-dashboard
    image_name: data-dashboard
    app_config_path: /usr/share/nginx/html/assets/config/app.config.json
    app_config_var: sage-public-dashboard_app_config_obj
    nginx_locations:
      - path: /management
        target: "{{ sage_public_connector_address }}/api/management"
      - path: /catalog-proxy/
        target: "{{ sage_public_connector_address }}/api/catalog-proxy/"
      - path: /catalog
        target: "{{ sage_public_connector_address }}/api/catalog-proxy/catalog/request"
    extra_config_files:
      - name: participants.json
        path: /usr/share/nginx/html/assets/participants.json
        content_var: participants_json_obj

- name: "Deploy sage-public keycloak"
  include_tasks: deploy-stateless-tasks/templates/keycloak.yaml
  vars:
    component: sage-public-identity-provider
    kc_tmp_volume: "sage-public-keycloak-tmp"

- name: "Deploy edwin edc connector"
  include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
  vars:
    image_name: connector
    component: edwin-connector
    ports:
      - name: api
        containerPort: 8080
        protocol: TCP
      - name: management
        containerPort: 8081
        protocol: TCP
      - name: dsp
        containerPort: 8082
        protocol: TCP
      - name: control
        containerPort: 8083
        protocol: TCP
      - name: catalog
        containerPort: 8084
        protocol: TCP
      - name: version
        containerPort: 8085
        protocol: TCP
      - name: catalogproxy
        containerPort: 8086
        protocol: TCP
      - name: public
        containerPort: 11001
        protocol: TCP

- name: "Deploy edwin edc identity hub"
  include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
  vars:
    image_name: identity-hub
    component: edwin-identity-hub
    ports:
      - name: api
        containerPort: 7080
