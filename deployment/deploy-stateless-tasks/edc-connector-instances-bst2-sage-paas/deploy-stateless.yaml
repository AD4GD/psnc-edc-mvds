- name: "Deploy edwin dashboard"
  include_tasks: deploy-stateless-tasks/templates/connector-dashboard.yaml
  vars:
    component: edwin-dashboard
    image_name: data-dashboard
    app_config_path: /usr/share/nginx/html/assets/config/app.config.json
    app_config_var: edwin-dashboard_app_config_obj
    nginx_locations:
      - path: /management
        target: "{{ edwin_connector_address }}/api/management"
      - path: /catalog-proxy/
        target: "{{ edwin_connector_address }}/api/catalog-proxy/"
      - path: /catalog
        target: "{{ edwin_connector_address }}/api/catalog-proxy/catalog/request"
    extra_config_files:
      - name: participants.json
        path: /usr/share/nginx/html/assets/participants.json
        content_var: participants_json_obj

- name: "Deploy edwin keycloak"
  include_tasks: deploy-stateless-tasks/templates/keycloak.yaml
  vars:
    component: edwin-identity-provider
    kc_tmp_volume: "edwin-keycloak-tmp"

- name: "Deploy edc federated catalog"
  include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
  vars:
    image_name: federated-catalog
    component: federated-catalog
    ports:
      - name: api
        containerPort: 8290
        protocol: TCP
      - name: management
        containerPort: 8291
        protocol: TCP
      - name: dsp
        containerPort: 8292
        protocol: TCP
      - name: control
        containerPort: 8293
        protocol: TCP
      - name: catalog
        containerPort: 8294
        protocol: TCP
      - name: version
        containerPort: 8295
        protocol: TCP
      - name: targets
        containerPort: 8296
        protocol: TCP
      - name: public
        containerPort: 13001
        protocol: TCP

- name: "Deploy edc federated catalog identity hub"
  include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
  vars:
    image_name: identity-hub
    component: federated-catalog-identity-hub
