      - name: api
        containerPort: 7080
        protocol: TCP
      - name: credentials
        containerPort: 7081
        protocol: TCP
      - name: identity
        containerPort: 7082
        protocol: TCP
      - name: did
        containerPort: 7083
        protocol: TCP
      - name: version
        containerPort: 7085
        protocol: TCP
      - name: sts
        containerPort: 7086
