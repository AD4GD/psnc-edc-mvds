- name: "deploy deployment/{{ application }}-identityproviderconsumer"
  tags:
    - identityproviderconsumer
    - deployment
  k8s:
    definition:
      apiVersion: v1
      kind: Deployment
      metadata:
        name: "{{ application }}-identityproviderconsumer"
        labels:
          component: identityproviderconsumer
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        revisionHistoryLimit: "{{ initial_replicas }}"
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: identityproviderconsumer
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: identityproviderconsumer
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (identityproviderconsumer_configmap_digest + identityproviderconsumer_secret_digest)|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            ports:
              - name: "keycloak-https"
                containerPort: 8443
                protocol: "TCP"
              - name: "keycloak-http"
                containerPort: 8080
                protocol: "TCP"

            containers:
              - name: "identityproviderconsumer"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/identity-provider:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ identityproviderconsumer_resources }}"
                envFrom:
                  - configMapRef:
                      name: "{{ application }}-identityproviderconsumer"
                      optional: true
                  - secretRef:
                      name: "{{ application }}-identityproviderconsumer"
                      optional: true
                volumeMounts:
                  - name: "identityproviderconsumer-tmp"
                    mountPath: "/tmp"
            volumes:
              - name: "identityproviderconsumer-tmp"
                emptyDir:
                  medium: "Memory"

- name: "deploy service/{{ application }}-identityproviderconsumer"
  tags:
    - identityproviderconsumer
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-identityproviderconsumer"
        labels:
          application: "{{ application }}"
          component: identityproviderconsumer
      spec:
        ports:
          - name: "keycloak-https"
            port: 8443
          - name: "keycloak-http"
            port: 8080
        selector:
          application: "{{ application }}"
          component: identityproviderconsumer
      envFrom:
        - configMapRef:
            name: "{{ application }}-identityproviderconsumer"
            optional: true
        - secretRef:
            name: "{{ application }}-identityproviderconsumer"
            optional: true
