---
- name: deploy stateless services
  hosts: "{{ lookup('env', 'edc_connector_instances_target') }}"

  vars:
    horizontal_pod_autoscalers_state: "{{ 'present' if with_stateless_services_horizontal_pod_autoscalers else 'absent' }}"
    horizontal_pod_autoscalers_task_heading: "{{ 'deploy' if with_stateless_services_horizontal_pod_autoscalers else 'purge' }}"

  module_defaults:
    k8s:
      wait: true
      wait_timeout: "{{ k8s_wait_timeout }}"
      state: present
      namespace: "{{ k8s_namespace }}"

  # deployed_parameters_packs is defining wheter a given service is deployed or not, it is located in group_vars/edc-connector-instances-<cluster>.yaml
  tasks:
    # Consumer
    # Consumer Connector
    - include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
      vars:
        image_name: connector
        component: consumer
        ports:
          - name: api
            containerPort: 8080
            protocol: TCP
          - name: management
            containerPort: 8081
            protocol: TCP
          - name: dsp
            containerPort: 8082
            protocol: TCP
          - name: control
            containerPort: 8083
            protocol: TCP
          - name: catalog
            containerPort: 8084
            protocol: TCP
          - name: version
            containerPort: 8085
            protocol: TCP
          - name: catalogproxy
            containerPort: 8086
            protocol: TCP
          - name: public
            containerPort: 11001
            protocol: TCP
        service_ports:
          - name: api
            port: 8080
          - name: management
            port: 8081
          - name: dsp
            port: 8082
          - name: control
            port: 8083
          - name: catalog
            port: 8084
          - name: version
            port: 8085
          - name: catalogproxy
            port: 8086
          - name: public
            port: 11001

    # Consumer Identity Hub
    - include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
      vars:
        image_name: identity-hub
        component: consumer
        ports:
          - name: api
            containerPort: 7080
            protocol: TCP
          - name: credentials
            containerPort: 7081
            protocol: TCP
          - name: identity
            containerPort: 7082
            protocol: TCP
          - name: did
            containerPort: 7083
            protocol: TCP
          - name: version
            containerPort: 7085
            protocol: TCP
          - name: sts
            containerPort: 7086
            protocol: TCP

    # Consumer Backend
    - include_tasks: deploy-stateless-tasks/templates/consumer-backend.yaml

    # Consumer Dashboard
    - include_tasks: deploy-stateless-tasks/templates/connector-dashboard.yaml
      vars:
        component: consumerdashboard
        image_name: data-dashboard
        app_config_path: /usr/share/nginx/html/assets/config/app.config.json
        app_config_var: consumer_dashboard_app_config_obj
        nginx_locations:
          - path: /management
            target: "{{ consumer_connector_address }}/api/management"
          - path: /catalog-proxy/
            target: "{{ consumer_connector_address }}/api/catalog-proxy/"
          - path: /catalog
            target: "{{ consumer_connector_address }}/api/catalog-proxy/catalog/request"
        extra_config_files:
          - name: participants.json
            path: /usr/share/nginx/html/assets/participants.json
            content_var: participants_json_obj

    # Consumer Keycloak
    - include_tasks: deploy-stateless-tasks/templates/keycloak.yaml
      vars:
        component: consumerkeycloak
        kc_tmp_volume: "consumerkeycloak-tmp"

    # Provider
    # Provider Connector
    - include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
      vars:
        image_name: connector
        component: provider
        ports:
          - name: api
            containerPort: 8080
            protocol: TCP
          - name: management
            containerPort: 8081
            protocol: TCP
          - name: dsp
            containerPort: 8082
            protocol: TCP
          - name: control
            containerPort: 8083
            protocol: TCP
          - name: catalog
            containerPort: 8084
            protocol: TCP
          - name: version
            containerPort: 8085
            protocol: TCP
          - name: catalogproxy
            containerPort: 8086
            protocol: TCP
          - name: public
            containerPort: 11001
            protocol: TCP

    # Provider Identity Hub
    - include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
      vars:
        image_name: identity-hub
        component: provider
        ports:
          - name: api
            containerPort: 7080
            protocol: TCP
          - name: credentials
            containerPort: 7081
            protocol: TCP
          - name: identity
            containerPort: 7082
            protocol: TCP
          - name: did
            containerPort: 7083
            protocol: TCP
          - name: version
            containerPort: 7085
            protocol: TCP
          - name: sts
            containerPort: 7086
            protocol: TCP

    # Provider Dashboard
    - include_tasks: deploy-stateless-tasks/templates/connector-dashboard.yaml
      vars:
        component: providerdashboard
        image_name: data-dashboard
        app_config_path: /usr/share/nginx/html/assets/config/app.config.json
        app_config_var: provider_dashboard_app_config_obj
        nginx_locations:
          - path: /management
            target: "{{ provider_connector_address }}/api/management"
          - path: /catalog-proxy/
            target: "{{ provider_connector_address }}/api/catalog-proxy/"
          - path: /catalog
            target: "{{ provider_connector_address }}/api/catalog-proxy/catalog/request"
        extra_config_files:
          - name: participants.json
            path: /usr/share/nginx/html/assets/participants.json
            content_var: participants_json_obj

    # Provider Keycloak
    - include_tasks: deploy-stateless-tasks/templates/keycloak.yaml
      vars:
        component: providerkeycloak
        kc_tmp_volume: "providerkeycloak-tmp"

    # Data Space Authority
    # Federated Catalog
    - include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
      vars:
        image_name: federated-catalog
        component: federatedcatalog
        ports:
          - name: api
            containerPort: 8290
            protocol: TCP
          - name: management
            containerPort: 8291
            protocol: TCP
          - name: dsp
            containerPort: 8292
            protocol: TCP
          - name: control
            containerPort: 8293
            protocol: TCP
          - name: catalog
            containerPort: 8294
            protocol: TCP
          - name: version
            containerPort: 8295
            protocol: TCP
          - name: targets
            containerPort: 8296
            protocol: TCP
          - name: public
            containerPort: 13001
            protocol: TCP

    # Federated Catalog Identity Hub
    - include_tasks: deploy-stateless-tasks/templates/edc-service.yaml
      vars:
        image_name: identity-hub
        component: federatedcatalogidentityhub
        ports:
          - name: api
            containerPort: 7080
            protocol: TCP
          - name: credentials
            containerPort: 7081
            protocol: TCP
          - name: identity
            containerPort: 7082
            protocol: TCP
          - name: did
            containerPort: 7083
            protocol: TCP
          - name: version
            containerPort: 7085
            protocol: TCP
          - name: sts
            containerPort: 7086
            protocol: TCP

    # Data Space Hub
    - include_tasks: deploy-stateless-tasks/data-space-hub.yaml

    # Data Space Portal
    - include_tasks: deploy-stateless-tasks/data-space-portal.yaml

    # Mail Service
    - include_tasks: deploy-stateless-tasks/templates/mail-service.yaml

    # Data Space Keycloak
    # TODO: not integrated yet
