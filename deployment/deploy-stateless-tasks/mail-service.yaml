- name: "deploy deployment/{{ application }}-mailservice"
  tags:
    - mailservice
    - deployment
  k8s:
    definition:
      apiVersion: v1
      kind: Deployment
      metadata:
        name: "{{ application }}-mailservice"
        labels:
          component: mailservice
          application: "{{ application }}"
      spec:
        progressDeadlineSeconds: "{{ progress_deadline_seconds }}"
        replicas: "{{ initial_replicas }}"
        strategy:
          type: RollingUpdate
        selector:
          matchLabels:
            component: mailservice
            application: "{{ application }}"
        template:
          metadata:
            labels:
              component: mailservice
              application: "{{ application }}"
              image_tag: "{{ stateless_services_image_tag }}"
              parameters_digest: "{{ (mailservice_configmap_digest + mailservice_secret_digest)|hash('sha1') }}"
          spec:
            serviceAccountName: "run-any-uid"
            ports:
              - name: "receiver"
                containerPort: 5555
                protocol: "TCP"
            containers:
              - name: "mailservice"
                image: "{{ registry_domain }}/{{ registry_project }}/{{ registry_application }}/mail-service:{{ stateless_services_image_tag }}"
                imagePullPolicy: "{{ stateless_services_image_pull_policy }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                resources: "{{ mailservice_resources }}"
                envFrom:
                  - configMapRef:
                      name: "{{ application }}-mailservice"
                      optional: true
                  - secretRef:
                      name: "{{ application }}-mailservice"
                      optional: true
                volumeMounts:
                  - name: "mailservice-tmp"
                    mountPath: "/tmp"
            volumes:
              - name: "mailservice-tmp"
                emptyDir:
                  medium: "Memory"

- name: "deploy service/{{ application }}-mailservice"
  tags:
    - mailservice
    - service
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ application }}-mailservice"
        labels:
          application: "{{ application }}"
          component: mailservice
      spec:
        ports:
          - name: "receiver"
            port: 5555
        selector:
          application: "{{ application }}"
          component: mailservice
      envFrom:
        - configMapRef:
            name: "{{ application }}-mailservice"
            optional: true
