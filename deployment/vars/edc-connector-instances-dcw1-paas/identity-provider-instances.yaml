random_keycloak_user: "{{ lookup('password', '/dev/null length=12 chars=ascii_lowercase') }}"
random_keycloak_pass: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

identityprovider_configmap__05_defaults:
  KC_DB: "postgres"
  KC_DB_SCHEMA: "public"
  KC_HOSTNAME_URL: "{{ identity_provider_address }}"
  KC_HOSTNAME_ADMIN_URL: "{{ identity_provider_address }}"
  KEYCLOAK_FRONTEND_URL: "{{ identity_provider_address }}/protocol"
  KC_PROXY: "edge"

identityprovider_secret__05_defaults:
  KEYCLOAK_ADMIN: "{{ random_keycloak_user }}"
  KEYCLOAK_ADMIN_PASSWORD: "{{ random_keycloak_pass }}"
