connectorprovider_configmap__05_defaults:
  # control plane specific config
  EDC_IAM_ISSUER_ID: did:web:provider-identity-hub-dcp-data-space.apps.bst2.paas.psnc.pl:bob
  WEB_HTTP_PORT: 8080
  WEB_HTTP_PATH: /api
  WEB_HTTP_MANAGEMENT_PORT: 8081
  WEB_HTTP_MANAGEMENT_PATH: /api/management
  WEB_HTTP_PROTOCOL_PORT: 8082
  WEB_HTTP_PROTOCOL_PATH: /api/dsp
  WEB_HTTP_CONTROL_PORT: 8083
  WEB_HTTP_CONTROL_PATH: /api/control
  WEB_HTTP_CATALOG_PORT: 8084
  WEB_HTTP_CATALOG_PATH: /api/catalog
  WEB_HTTP_VERSION_PORT: 8085
  WEB_HTTP_VERSION_PATH: /api/version
  EDC_IAM_DID_WEB_USE_HTTPS: true
  EDC_IAM_STS_PRIVATEKEY_ALIAS: key-1
  EDC_IAM_STS_PUBLICKEY_ID: did:web:provider-identity-hub-dcp-data-space.apps.bst2.paas.psnc.pl:bob#key-1
  EDC_DSP_CALLBACK_ADDRESS: https://provider-connector-dcp-data-space.apps.bst2.paas.psnc.pl/api/dsp
