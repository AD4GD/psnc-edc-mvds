consumer_random_keycloak_user: "{{ lookup('password', '/dev/null length=12 chars=ascii_lowercase') }}"
consumer_random_keycloak_pass: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

identityproviderconsumer_configmap__05_defaults:
  KC_DB: "postgres"
  KC_DB_SCHEMA: "public"
  KC_HOSTNAME: "{{ consumer_identity_provider_address }}"
  KC_HOSTNAME_STRICT: "false"
  KC_HTTP_ENABLED: "true"
  KC_PROXY_ADDRESS_FORWARDING: "true"
  KC_PROXY_HEADERS: "xforwarded"

identityproviderconsumer_secret__05_defaults:
  KEYCLOAK_ADMIN: "{{ consumer_random_keycloak_user }}"
  KEYCLOAK_ADMIN_PASSWORD: "{{ consumer_random_keycloak_pass }}"
