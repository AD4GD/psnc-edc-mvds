random_storage_user: "{{ lookup('password', '/dev/null length=12 chars=ascii_lowercase') }}"
random_storage_pass: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

ceadspublicbackend_configmap__05_defaults:
  MINIO_ENDPOINT: "{{ storage_address }}"

ceadspublicbackend_secret__05_defaults:
  MINIO_ACCESS_KEY:
    when_missing: "{{ random_storage_user }}"
  MINIO_SECRET_KEY:
    when_missing: "{{ random_storage_pass }}"
