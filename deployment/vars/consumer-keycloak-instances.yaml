random_keycloak_user: "{{ lookup('password', '/dev/null length=12 chars=ascii_lowercase') }}"
random_keycloak_pass: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

consumerkeycloak_configmap__05_defaults:
  KC_DB: "postgres"
  KC_DB_SCHEMA: "public"
  KC_HOSTNAME: "{{ consumer_keycloak_address | regex_replace('^https?://|/$', '') }}"
  KC_HOSTNAME_STRICT: "false"
  KC_HOSTNAME_STRICT_HTTPS: "false"
  # KC_HTTP_ENABLED: "true"
  KC_PROXY: "edge"
  KC_PROXY_HEADERS: "xforwarded"

consumerkeycloak_secret__05_defaults:
  KEYCLOAK_ADMIN: "{{ random_keycloak_user }}"
  KEYCLOAK_ADMIN_PASSWORD: "{{ random_keycloak_pass }}"
