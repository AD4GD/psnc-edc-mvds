sage_public_random_keycloak_user: "{{ lookup('password', '/dev/null length=12 chars=ascii_lowercase') }}"
sage_public_random_keycloak_pass: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

sage-public-identity-provider_configmap__05_defaults:
  KC_DB: "postgres"
  KC_DB_SCHEMA: "public"
  KC_HOSTNAME: "sage-public-keycloak-sage-data-space.apps.bst2.paas.psnc.pl"
  KC_HOSTNAME_STRICT: "false"
  KC_HTTP_ENABLED: "true"
  KC_PROXY_ADDRESS_FORWARDING: "true"
  KC_PROXY_HEADERS: "xforwarded"

sage-public-identity-provider_secret__05_defaults:
  KEYCLOAK_ADMIN: "{{ sage_public_random_keycloak_user }}"
  KEYCLOAK_ADMIN_PASSWORD: "{{ sage_public_random_keycloak_pass }}"
