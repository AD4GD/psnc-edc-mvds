---
# Basic settings
application: edc-connector
k8s_namespace: edc-connector
kubeconfig_path: "~/.kube/config"

# Images
image_registry: "docker.io/psncedcmvds"
image_tag: "latest"
image_pull_policy: "IfNotPresent"
image_pull_secret_name: ""

connector_image: "{{ image_registry }}/connector:{{ image_tag }}"
dashboard_image: "{{ image_registry }}/data-dashboard:{{ image_tag }}"
keycloak_image: "{{ image_registry }}/identity-provider:{{ image_tag }}"
identity_hub_image: "{{ image_registry }}/identity-hub:{{ image_tag }}"
consumer_backend_image: "{{ image_registry }}/consumer-backend:{{ image_tag }}"
vault_image: "hashicorp/vault:1.16"
storage_image: "rustfs/rustfs:1.0.0-alpha.87"
postgres_image: "docker.io/bitnami/postgresql:latest"

# Deployment sections
# Required section is always deployed: connector + connector DB + dashboard.
# Optional sections below
enable_identity_provider: true
enable_identity_hub: true
enable_storage: true

# Public addresses
public_scheme: "https"
connector_host: "connector.example.org"
dashboard_host: "dashboard.example.org"
keycloak_host: "keycloak.example.org"
identity_hub_host: "identity-hub.example.org"
storage_host: "storage.example.org"
consumer_backend_host: "consumer-backend.example.org"
keyvault_host: "vault.example.org"
# OpenShift Route source IP whitelist (comma-separated CIDRs). Empty means no Route-level restriction.
route_ip_whitelist: ""

# Data Space settings
issuer_did: "<issuer-did>"
federated_catalog_address: "https://federated-catalog.example.org"
data_space_hub_address: "https://data-space-hub.example.org"
catalog_api_key: ""

# Connector identity (single place to manage per new connector)
# 1) Set connector_id for each connector instance.
# 2) participant_id can stay derived or be overridden explicitly with your DID.
connector_id: "change-me-connector-id"
participant_id: "did:web:{{ identity_hub_host }}:{{ connector_id }}"

# Connector auth defaults
connector_auth_key: "password"
sts_client_secret: "sts-client-secret"

# Auth toggles (Connector APIs)
# If true, enable token-based auth for management/control/default and composite for catalogproxy.
is_auth: true

# Optional: override audiences/roles. Leave empty to skip audience/role checks.
web_http_management_auth_audience: []
web_http_management_auth_roles: []
web_http_catalogproxy_auth_audience: []
web_http_catalogproxy_auth_roles: []

# Ingress
ingress_class_name: ""
ingress_tls_enabled: false
ingress_tls_secret_name: ""

# Databases (PVC + Service)
connector_db_service: "{{ application }}-connector-db"
keycloak_db_service: "{{ application }}-keycloak-db"
identity_hub_db_service: "{{ application }}-identity-hub-db"
connector_db_storage_size: "5Gi"
keycloak_db_storage_size: "5Gi"
identity_hub_db_storage_size: "5Gi"
connector_db_name: "edc_connector_db"

# Vault
vault_replicas: 1
vault_pvc_storage_size: "1Gi"
vault_storage_class_name: ""
vault_service_account_name: "default"
identity_hub_vault_instance: "{{ connector_id }}-ih"
vault_url: "http://{{ application }}-vault-{{ identity_hub_vault_instance }}:8200"

# Vault probes
readiness_probe_period: 10
liveness_probe_period: 30
vault_resources: {}

# Resources (optional)
# Connector
connector_replicas: 1
connector_resources:
  requests:
    cpu: "100m"
    memory: "1000Mi"
  limits:
    cpu: "1"
    memory: "2000Mi"
# Dashboard
dashboard_replicas: 1
dashboard_resources:
  requests:
    cpu: "100m"
    memory: "200Mi"
  limits:
    cpu: "1"
    memory: "400Mi"
# Keycloak (identity provider)
keycloak_replicas: 1
keycloak_resources:
  requests:
    cpu: "100m"
    memory: "400Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
# Identity Hub
identity_hub_replicas: 1
identity_hub_resources:
  requests:
    cpu: "100m"
    memory: "400Mi"
  limits:
    cpu: "1"
    memory: "1Gi"
# Storage + Consumer backend
storage_replicas: 1
storage_resources:
  requests:
    cpu: "100m"
    memory: "200Mi"
  limits:
    cpu: "1"
    memory: "400Mi"
consumer_backend_replicas: 1
consumer_backend_resources:
  requests:
    cpu: "100m"
    memory: "200Mi"
  limits:
    cpu: "1"
    memory: "400Mi"

# Storage section (optional)
storage_bucket: "downloads"
storage_console_enable: "true"
storage_pvc_size: "10Gi"

# Consumer backend is part of the storage section and is not toggled separately.
consumer_backend_s3_endpoint_url: "{{ public_scheme }}://{{ storage_host }}"
consumer_backend_s3_default_prefix: "edc-transfers"
consumer_backend_s3_default_folder: "anonymous"

# Dashboard app config
dashboard_theme: "theme-3"
dashboard_backend_url: "{{ public_scheme }}://{{ consumer_backend_host }}"
dashboard_oauth_client_id: "data-space-users"
