apiVersion: v1
kind: Secret
metadata:
  name: storage-secret
  labels:
    app: edc-consumer
    component: storage
type: Opaque
stringData:
  # RustFS S3-compatible storage credentials
  RUSTFS_ACCESS_KEY: "{{ secrets.storage.rustfs_access_key }}"
  RUSTFS_SECRET_KEY: "{{ secrets.storage.rustfs_secret_key }}"
