consumer_identity_provider_address: "https://consumer-identity-provider-dcp-data-space.apps.bst2.paas.psnc.pl"
consumer_keyvault_address: "https://consumer-keyvault-dcp-data-space.apps.bst2.paas.psnc.pl"
consumer_backend_address: "https://consumer-backend-dcp-data-space.apps.bst2.paas.psnc.pl"
minio_address: "https://consumer-minio-dcp-data-space.apps.bst2.paas.psnc.pl"

provider_connector_address: "https://provider-connector-dcp-data-space.apps.bst2.paas.psnc.pl"
provider_identity_hub_address: "https://provider-identity-hub-dcp-data-space.apps.bst2.paas.psnc.pl"
provider_dashboard_address: "https://provider-dashboard-dcp-data-space.apps.bst2.paas.psnc.pl"
provider_dashboard_address_shorten: "provider-dashboard-dcp-data-space.apps.bst2.paas.psnc.pl"
provider_identity_provider_address: "https://provider-identity-provider-dcp-data-space.apps.bst2.paas.psnc.pl"
provider_keyvault_address: "https://provider-keyvault-dcp-data-space.apps.bst2.paas.psnc.pl"

federated_catalog_address: "https://federated-catalog-dcp-data-space.apps.bst2.paas.psnc.pl"
federated_catalog_identity_hub_address: "https://federated-catalog-identity-hub-dcp-data-space.apps.bst2.paas.psnc.pl"
federated_catalog_keyvault_address: "https://federated-catalog-keyvault-dcp-data-space.apps.bst2.paas.psnc.pl"
data_space_portal_address: "https://data-space-portal-dcp-data-space.apps.bst2.paas.psnc.pl"
data_space_portal_address_shorten: "data-space-portal-dcp-data-space.apps.bst2.paas.psnc.pl"
data_space_hub_address: "https://data-space-hub-dcp-data-space.apps.bst2.paas.psnc.pl"
data_space_hub_keyvault_address: "https://data-space-hub-keyvault-dcp-data-space.apps.bst2.paas.psnc.pl"
mail_service_address: "https://mail-service-dcp-data-space.apps.bst2.paas.psnc.pl"

consumer_dashboard_app_config_obj:
  managementApiUrl: "{{ consumer_connector_address }}/management"
  catalogUrl: "{{ federated_catalog_address }}/catalog"
  theme: "theme-3"
  deploymentMode: "production"
  backendUrl: "{{ consumer_backend_address }}/edr-endpoint"
  edcApiKey: "password"

provider_dashboard_app_config_obj:
  managementApiUrl: "{{ provider_connector_address }}/management"
  catalogUrl: "{{ federated_catalog_address }}/catalog"
  theme: "theme-3"
  deploymentMode: "production"
  backendUrl: "{{ consumer_backend_address }}/edr-endpoint"
  edcApiKey: "password"

dataspaceportal_app_config_obj:
  apiBaseUrl: "{{ data_space_hub_address }}/api"
  isProduction: false

# DO NOT CHANGE DEFINITIONS BELOW

deployed_parameters_packs: "{{ ['connectorconsumer', 'identityhubconsumer', 'consumerdashboard', 'identityproviderconsumer', 'connectorprovider', 'identityhubprovider', 'providerdashboard', 'identityproviderprovider', 'consback', 'federatedcatalog', 'dataspacehub', 'dataspaceportal', 'identityhubfederatedcatalog', 'keyvaultconsumer', 'keyvaultprovider', 'keyvaultdataspacehub', 'keyvaultfederatedcatalog', 'mailservice'] }}"

