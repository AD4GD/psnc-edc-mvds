- name: Derive names for this Vault instance
  set_fact:
    vault_name: "{{ application }}-vault-{{ vault_instance }}"
    vault_headless_svc: "{{ application }}-vault-{{ vault_instance }}-internal"
    vault_client_svc: "{{ application }}-vault-{{ vault_instance }}"
    vault_replicas_eff: "{{ vault_replicas | default(3) }}"
    vault_image_tag_eff: "{{ vault_image_tag | default('1.16.3') }}"
    vault_storage_eff: "{{ vault_pvc_storage_size | default('1Gi') }}"
    vault_pvc_storage_class_name: "standard"

# -----------------------------
# ConfigMap with raft config
# -----------------------------
- name: "deploy configmap/{{ vault_name }}-config"
  tags: [vault, configmap]
  k8s:
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ vault_name }}-config"
        labels:
          application: "{{ application }}"
          component: "vault"
          vault_instance: "{{ vault_instance }}"
      data:
        vault.hcl: |
          ui = true
          disable_mlock = true
          listener "tcp" {
            address     = "0.0.0.0:8200"
            tls_disable = 1
          }

          storage "file" {
            path = "/vault/data"

            # Peer discovery via headless service DNS.
            # For 3 replicas, list -0, -1, -2. If you change replicas, update accordingly.
            retry_join {
              leader_api_addr = "http://{{ vault_name }}-0.{{ vault_headless_svc }}.{{ k8s_namespace }}.svc.cluster.local:8200"
            }
            retry_join {
              leader_api_addr = "http://{{ vault_name }}-1.{{ vault_headless_svc }}.{{ k8s_namespace }}.svc.cluster.local:8200"
            }
            retry_join {
              leader_api_addr = "http://{{ vault_name }}-2.{{ vault_headless_svc }}.{{ k8s_namespace }}.svc.cluster.local:8200"
            }
          }

          api_addr     = "http://{{ vault_client_svc }}.{{ k8s_namespace }}.svc.cluster.local:8200"
          cluster_addr = "http://$(POD_NAME).{{ vault_headless_svc }}.{{ k8s_namespace }}.svc.cluster.local:8201"

# -----------------------------
# Headless service (cluster members)
# -----------------------------
- name: "deploy service/{{ vault_headless_svc }} (headless)"
  tags: [vault, service]
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ vault_headless_svc }}"
        labels:
          application: "{{ application }}"
          component: "vault"
          vault_instance: "{{ vault_instance }}"
      spec:
        clusterIP: None
        publishNotReadyAddresses: true
        selector:
          application: "{{ application }}"
          component: "vault"
          vault_instance: "{{ vault_instance }}"
        ports:
          - name: vault-http
            port: 8200
            targetPort: 8200
          - name: vault-cluster
            port: 8201
            targetPort: 8201

# -----------------------------
# Client service (stable access)
# -----------------------------
- name: "deploy service/{{ vault_client_svc }}"
  tags: [vault, service]
  k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ vault_client_svc }}"
        labels:
          application: "{{ application }}"
          component: "vault"
          vault_instance: "{{ vault_instance }}"
      spec:
        selector:
          application: "{{ application }}"
          component: "vault"
          vault_instance: "{{ vault_instance }}"
        ports:
          - name: vault-http
            port: 8200
            targetPort: 8200

# -----------------------------
# StatefulSet (real stateful: stable identity + PV per pod)
# -----------------------------
- name: "deploy statefulset/{{ vault_name }}"
  tags: [vault, statefulset]
  k8s:
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: "{{ vault_name }}"
        labels:
          application: "{{ application }}"
          component: "vault"
          vault_instance: "{{ vault_instance }}"
      spec:
        serviceName: "{{ vault_headless_svc }}"
        replicas: "{{ initial_replicas }}"
        revisionHistoryLimit: "{{ initial_replicas }}"
        selector:
          matchLabels:
            application: "{{ application }}"
            component: "vault"
            vault_instance: "{{ vault_instance }}"
        template:
          metadata:
            labels:
              application: "{{ application }}"
              component: "vault"
              vault_instance: "{{ vault_instance }}"
          spec:
            initContainers:
              - name: volume-permissions
                image: busybox:1.36
                command: ["sh", "-c", "chown -R 1000:1000 /vault/data && chmod -R g+rwX /vault/data"]
                securityContext:
                  runAsUser: 0
                volumeMounts:
                  - name: vault-data
                    mountPath: /vault/data
            serviceAccountName: "{{ vault_service_account_name | default('run-any-uid') }}"
            terminationGracePeriodSeconds: 30
            containers:
              - name: vault
                image: "hashicorp/vault:{{ vault_image_tag_eff }}"
                imagePullPolicy: Always
                args: ["server", "-config=/etc/vault/vault.hcl"]
                ports:
                  - name: vault-http
                    containerPort: 8200
                    protocol: TCP
                  - name: vault-cluster
                    containerPort: 8201
                    protocol: TCP
                env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: VAULT_ADDR
                    value: "http://127.0.0.1:8200"
                  - name: SKIP_SETCAP
                    value: 'true'
                resources: "{{ vault_resources | default({}) }}"
                securityContext:
                  readOnlyRootFilesystem: false
                  runAsNonRoot: true
                  runAsUser: 1000
                volumeMounts:
                  - name: vault-config-ro
                    readOnly: true
                    mountPath: /etc/vault
                  - name: vault-data
                    mountPath: /vault/data
                readinessProbe:
                  tcpSocket:
                    port: vault-http
                  initialDelaySeconds: 15
                  periodSeconds: "{{ readiness_probe_period }}"
                livenessProbe:
                  tcpSocket:
                    port: vault-http
                  initialDelaySeconds: 30
                  periodSeconds: "{{ liveness_probe_period }}"
            volumes:
              - name: vault-config-ro
                configMap:
                  name: "{{ vault_name }}-config"
                  items:
                    - key: vault.hcl
                      path: vault.hcl
        volumeClaimTemplates:
          - metadata:
              name: vault-data
              labels:
                application: "{{ application }}"
                component: "vault"
                vault_instance: "{{ vault_instance }}"
            spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: "{{ vault_pvc_storage_class_name }}"
              resources:
                requests:
                  storage: "{{ vault_storage_eff }}"