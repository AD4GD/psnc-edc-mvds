info:
  name: Negotiate Contract
  type: http
  seq: 5

http:
  method: POST
  url: "{{CONSUMER_URL}}/management/v3/contractnegotiations"
  body:
    type: form-urlencoded
    data:
      - name: |-
          {
              "@context": {"edc": "https://w3id.org/edc/v0.0.1/ns/"},
              "@type": "ContractRequest",
              "counterPartyAddress": "https://ad4gd-provider-edc.dashboard-siba.store/protocol",
              "protocol": "dataspace-protocol-http",
              "policy": {
                  "@context": "http://www.w3.org/ns/odrl.jsonld",
                  "@id": "{{offer_id}}",
                  "@type": "Offer",
                  "assigner": "provider",
                  "target": "assetId",
                  "permission": []
              }
          }
        value: ""
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
