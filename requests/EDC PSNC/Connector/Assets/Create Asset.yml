            "dct:abstract": "Goma (1563 m a.s.l.) is the capital city of North Kivu province in the eastern Democratic Republic of the Congo. It is located on the northern shore of Lake Kivu, next to the Rwandan city of Gisenyi. The lake and the two cities are in the Albertine Rift, the western branch of the East African Rift system. Goma lies only 13 to 18 km due south of the crater of the active Nyiragongo Volcano. The recent history of Goma has been dominated by the volcano and the Rwandan Genocide of 1994, which in turn fuelled the First and Second Congo Wars.\n\nSite name, Latitude, Longitude, Altitude, Site characteristics. \nGoma PAS  1, -1.668311, 29.238610, 1534, Remote\nGoma PAS  2, -1.652568, 29.239960, 1563, Urban",
