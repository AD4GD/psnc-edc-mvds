info:
  name: Get PR token directly
  type: http
  seq: 3

http:
  method: POST
  url: "{{PR_ADDRESS}}/connect/token"
  body:
    type: form-urlencoded
    data:
      - name: client_assertion_type
        value: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
      - name: client_id
        value: "{{ISHARE.CLIENT_ID}}"
      - name: client_assertion
        value: "{{ISHARE.CLIENT_ASSERTION}}"
      - name: grant_type
        value: client_credentials
      - name: scope
        value: iSHARE

runtime:
