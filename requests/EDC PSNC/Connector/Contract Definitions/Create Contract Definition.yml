info:
  name: Create Contract Definition
  type: http
  seq: 1

http:
  method: POST
  url: "{{PROVIDER_CONNECTOR_MANAGEMENT_URL}}/v3/contractdefinitions"
  body:
    type: json
    data: |-
      {
        "@context": {
          "edc": "https://w3id.org/edc/v0.0.1/ns/"
        },
        "@id": "{{contract-agreement-id}}",
        "accessPolicyId": "{{policy-id}}",
        "contractPolicyId": "{{policy-id}}",
        "assetsSelector": [
          {
            "operandLeft": "https://w3id.org/edc/v0.0.1/ns/id",
            "operator": "in",
            "operandRight": [ {{asset-id}}
            ]
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
