# TEMP File 
# will be removed later
services:
  dataspace-issuer:
    image: nginx:latest
    ports:
      - "9876:80"
    volumes:
      - ../docker/issuer-service/assets/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/issuer-service/assets/did.k8s.json:/var/www/.well-known/did.json:ro

  provider-user-management-service:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/user-management-service:${IMAGE_TAG}
    volumes:
      - ../docker/user-management-service/config/configuration-provider.properties:/app/.env:ro
    ports:
      - "8300:8000"
    depends_on:
      - provider-user-management-service-postgres

  provider-user-management-service-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5442:5432'
    volumes:
      - 'provider-user-management-service-postgres:/bitnami/postgresql'
  
  mail-service:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/mail-service:${IMAGE_TAG}
    ports:
      - "5555:5555"
    volumes:
      - ../docker/mail-service/config/configuration.properties:/app/.env:ro
    entrypoint: "make prod p=5555"

  # will go to the provider
  provider-connector:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/connector:${IMAGE_TAG}
    ports:
      - "8190:8190"
      - "8191:8191"
      - "8192:8192"
      - "8193:8193"
      - "8194:8194"
      - "8195:8195"
      - "12001:12001"
    volumes:
      - ../docker/connector/config/configuration-provider.properties:/app/configuration.properties:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    user: "root"
    depends_on:
      - provider-postgres
      - provider-keycloak

  provider-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5440:5432'
    volumes:
      - 'provider-postgresql:/bitnami/postgresql'

  provider-dashboard:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-dashboard:${IMAGE_TAG}
    ports:
      - "18080:80"
    volumes:
      - ../docker/data-dashboard/config/conf-provider/provider.nginx.conf:/etc/nginx/nginx.conf
      - ../docker/data-dashboard/config/conf-provider/provider.config.json:/usr/share/nginx/html/assets/config/app.config.json
    user: "root"
    depends_on:
      - provider-connector

  # Digital Wallet System
  provider-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7090:7090"
      - "7091:7091"
      - "7092:7092"
      - "7093:7093"
      - "7095:7095"
      - "7096:7096"
    volumes:
      - ../docker/identity-hub/config/configuration-provider.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/provider:/app/credentials/provider:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties

  provider-keycloak:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-provider:${IMAGE_TAG}
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: provider-keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: edc
      KC_HTTP_PORT: '48081'
      KC_HOSTNAME_URL: http://localhost:48083
      KC_HOSTNAME_ADMIN_URL: http://localhost:48083
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: edc
      KEYCLOAK_FRONTEND_URL: http://provider-keycloak:48081
      KC_CACHE: local
    depends_on:
      - provider-keycloak-postgres
    ports:
      - "48083:48081"

  provider-keycloak-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: keycloak
    ports:
      - '5441:5432'
    volumes:
      - 'provider-keycloak-postgresql:/bitnami/postgresql'

  consumer-dashboard:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-dashboard:${IMAGE_TAG}
    ports:
      - "28080:80"
    volumes:
      - ../docker/data-dashboard/config/conf-consumer/consumer.nginx.conf:/etc/nginx/nginx.conf
      - ../docker/data-dashboard/config/conf-consumer/consumer.config.json:/usr/share/nginx/html/assets/config/app.config.json
    user: "root"
    depends_on:
      - consumer-connector

  consumer-connector:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/connector:${IMAGE_TAG}
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
      - "11001:11001"
    volumes:
      - ../docker/connector/config/configuration-consumer.properties:/app/configuration.properties:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    user: "root"
    depends_on:
      - consumer-postgres
      - consumer-keycloak

  consumer-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7080:7080"
      - "7081:7081"
      - "7082:7082"
      - "7083:7083"
      - "7085:7085"
      - "7086:7086"
    volumes:
      - ../docker/identity-hub/config/configuration-consumer.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/consumer:/app/credentials/consumer:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - consumer-connector

  consumer-keycloak:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-provider:${IMAGE_TAG}
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: consumer-keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: edc
      KC_HTTP_PORT: '48081'
      KC_HOSTNAME_URL: http://localhost:48082
      KC_HOSTNAME_ADMIN_URL: http://localhost:48082
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: edc
      KEYCLOAK_FRONTEND_URL: http://keycloak:48081
      KC_CACHE: local
    depends_on:
      - consumer-keycloak-postgres
    ports:
      - "48082:48081"

  consumer-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5450:5432'
    volumes:
      - 'consumer-postgresql:/bitnami/postgresql'

  consumer-keycloak-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: keycloak
    ports:
      - '5451:5432'
    volumes:
      - 'consumer-keycloak-postgresql:/bitnami/postgresql'

  consumer-user-management-service:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/user-management-service:${IMAGE_TAG}
    volumes:
      - ../docker/user-management-service/config/configuration-consumer.properties:/app/.env:ro
    ports:
      - "8400:8000"
    depends_on:
      - consumer-user-management-service-postgres
  
  consumer-user-management-service-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5452:5432'
    volumes:
      - 'consumer-user-management-service-postgres:/bitnami/postgresql'

  federated-catalog:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/federated-catalog:${IMAGE_TAG}
    volumes:
      - ../docker/federated-catalog/config/configuration.properties:/app/configuration.properties:ro
      - ../docker/federated-catalog/config/participants.json:/app/config/participants.json
      - 'federated-catalog-postgresql:/bitnami/postgresql'
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - federated-catalog-postgres
      - provider-connector
    ports:
      - "8290:8290"
      - "8291:8291"
      - "8292:8292"
      - "8293:8293"
      - "8294:8294"
      - "8295:8295"
      - "13001:13001"

  fc-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7100:7100"
      - "7101:7101"
      - "7102:7102"
      - "7103:7103"
      - "7105:7105"
      - "7106:7106"
    volumes:
      - ../docker/identity-hub/config/configuration-fc.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/federated-catalog:/app/credentials/federated-catalog:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - federated-catalog
  
  federated-catalog-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5435:5432'
    volumes:
      - 'federated-catalog-postgresql:/bitnami/postgresql'

  # tmp instead of data space hub
  federated-catalog-user-management-service:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/user-management-service:${IMAGE_TAG}
    volumes:
      - ../docker/user-management-service/config/configuration-federated-catalog.properties:/app/.env:ro
    ports:
      - "8500:8000"
    depends_on:
      - federated-catalog-user-management-service-postgres
  
  federated-catalog-user-management-service-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5462:5432'
    volumes:
      - 'federated-catalog-user-management-service-postgres:/bitnami/postgresql'

  data-space-portal:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-space-portal:${IMAGE_TAG}
    ports:
      - "38081:80"
    volumes:
      - ../docker/data-space-portal/config/app.config.json:/app/public/app.config.json:ro
    user: "root"   

  data-space-hub:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-space-hub:${IMAGE_TAG}
    volumes:
      - ../docker/data-space-hub/config/config.properties:/app/.env:ro
    ports:
      - "8000:8000"
    entrypoint: "./entrypoint.sh" 

  data-space-hub-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5436:5432'
    volumes:
      - 'data-space-hub-postgres:/bitnami/postgresql'

  data-space-hub-vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: vault server -dev
    ports:
      - "8200:8200"

volumes:
  provider-user-management-service-postgres:
    driver: local
  provider-postgresql:
    driver: local
  provider-keycloak-postgresql:
    driver: local
  consumer-user-management-service-postgres:
    driver: local
  consumer-postgresql:
    driver: local
  consumer-keycloak-postgresql:
    driver: local
  federated-catalog-postgresql:
    driver: local
  federated-catalog-user-management-service-postgres:
    driver: local
  data-space-hub-postgres:
    driver: local
