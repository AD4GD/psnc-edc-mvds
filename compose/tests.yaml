services:

  registration-service-frontend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/registration-service-frontend:${IMAGE_TAG}
    volumes:
        - registration_frontend_nginx:/etc/nginx
        - registration_frontend_config:/usr/share/nginx/html/assets/config
    user: "root"
    depends_on:
      - registration-service-backend

  registration-service-backend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/registration-service-backend:${IMAGE_TAG}
    environment:
      EDC_FS_CONFIG: /app/config/configuration.properties
    depends_on:
      - registration-service-postgres
      - identity-provider

  registration-service-postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: edc
      POSTGRES_DB: edc
    volumes:
      - 'registration-service-postgresql:/var/lib/postgresql/data'

  federated-catalog:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/federated-catalog:${IMAGE_TAG}
    volumes:
      - federated_catalog_config_jks:/app/config
      - federated_catalog_daps_jks:/app/certs
    environment:
      EDC_FS_CONFIG: /app/config/configuration.properties
      EDC_CATALOG_CACHE_EXECUTION_PERIOD_SECONDS: 4
    depends_on:
      - consumer-connector
      - provider-connector

  data-source:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-source:${IMAGE_TAG}

  provider-dashboard:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-dashboard:${IMAGE_TAG}
    volumes:
      - provider_dashboard_nginx:/etc/nginx
      - provider_dashboard_config:/usr/share/nginx/html/assets/config
    user: "root"
    depends_on:
      - provider-connector

  provider-connector:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/connector:${IMAGE_TAG}
    volumes:
      - provider_daps_jks:/app/certs
    environment:
      EDC_FS_CONFIG: /app/config/configuration-provider.properties
    user: "root"
    depends_on:
      - provider-postgres
      - identity-provider

  provider-postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: edc
      POSTGRES_DB: edc
    volumes:
      - 'provider-postgresql:/var/lib/postgresql/data'

  consumer-dashboard:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-dashboard:${IMAGE_TAG}
    volumes:
      - consumer_dashboard_nginx:/etc/nginx
      - consumer_dashboard_config:/usr/share/nginx/html/assets/config
    user: "root"
    depends_on:
      - consumer-connector

  consumer-connector:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/connector:${IMAGE_TAG}
    volumes:
      - consumer_daps_jks:/app/certs
    environment:
      EDC_FS_CONFIG: /app/config/configuration-consumer.properties
    user: "root"
    depends_on:
      - consumer-postgres
      - identity-provider

  consumer-postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: edc
      POSTGRES_PASSWORD: edc
      POSTGRES_DB: edc
    volumes:
      - 'consumer-postgresql:/var/lib/postgresql/data'

  consumer-backend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/consumer-backend:${IMAGE_TAG}
    ports:
      - "4000:4000"
    environment:
      S3_ENDPOINT_URL: "http://storage:9000"
      S3_ACCESS_KEY: rustfs-admin
      S3_SECRET_KEY: rustfs
      S3_BUCKET: downloads
      S3_DEFAULT_PREFIX: edc-transfers
      S3_DEFAULT_FOLDER: anonymous
    depends_on:
      - storage

  storage:
    image: rustfs/rustfs:1.0.0-alpha.85 # ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/storage:${IMAGE_TAG}
    environment:
      - HOSTNAME=storage
      - RUSTFS_ACCESS_KEY=rustfs-admin
      - RUSTFS_SECRET_KEY=rustfs
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - storage-data:/data

  identity-provider:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-provider:${IMAGE_TAG}
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: identity-provider-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: edc
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: edc
      KEYCLOAK_FRONTEND_URL: http://identity-provider:8080
    depends_on:
      - identity-provider-postgres

  identity-provider-postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: edc
      POSTGRES_DB: keycloak
    volumes:
      - 'identity-provider-postgresql:/var/lib/postgresql/data'

  idp-filler:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/idp-filler:${IMAGE_TAG}
    restart: no
    tty: true
    environment:
      RUN_SCRIPT: 1
      KC_BASE: http://identity-provider:8080
      WEB_HTTP_RS_URI: http://registration-service-backend:8182
      KC_USER : admin
      KC_PASS : edc
      RS_USERNAME : psnc
      RS_PASSWORD : edc
    entrypoint: ["/bin/bash", "-c", "./entrypoint.sh && tail -f /dev/null"]
    depends_on:
      - identity-provider
      - registration-service-backend

  integration-tests:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/integration-tests:${IMAGE_TAG}
    environment:
      - STORAGE_ACCESS_KEY=rustfs-admin
      - STORAGE_SECRET_KEY=rustfs
      - AWS_ACCESS_KEY_ID=rustfs-admin
      - AWS_SECRET_ACCESS_KEY=rustfs
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_EC2_METADATA_DISABLED=true
      - S3_ENDPOINT_URL=http://storage:9000
      - S3_BUCKET=test
    depends_on:
      - provider-connector
      - consumer-connector
      - federated-catalog
      - consumer-backend
      - idp-filler
    entrypoint: "./entrypoint.sh"

volumes:
  consumer-postgresql:
    driver: local
  provider-postgresql:
    driver: local
  identity-provider-postgresql:
    driver: local
  registration-service-postgresql:
    driver: local
  registration_frontend_nginx:
  registration_frontend_config:
  federated_catalog_daps_jks:
  federated_catalog_config_jks:
  provider_dashboard_nginx:
  provider_dashboard_config:
  provider_daps_jks:
  consumer_dashboard_nginx:
  consumer_dashboard_config:
  consumer_daps_jks:
