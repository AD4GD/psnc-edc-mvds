services:
  consumer-dashboard:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-dashboard:${IMAGE_TAG}
    ports:
      - "28080:80"
    volumes:
      - ../docker/data-dashboard/config/conf-consumer/consumer.nginx.conf:/etc/nginx/nginx.conf
      - ../docker/data-dashboard/config/conf-consumer/consumer.config.json:/usr/share/nginx/html/assets/config/app.config.json
      - ../docker/data-dashboard/config/participants.json:/usr/share/nginx/html/assets/participants.json
    user: "root"
    depends_on:
      - consumer-connector

  consumer-connector:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/connector:${IMAGE_TAG}
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
      - "8086:8086"
      - "11001:11001"
    volumes:
      - ../docker/connector/config/configuration-consumer.properties:/app/configuration.properties:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    user: "root"
    depends_on:
      - consumer-postgres
      - consumer-keycloak
      - vault-unseal

  consumer-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7080:7080"
      - "7081:7081"
      - "7082:7082"
      - "7083:7083"
      - "7085:7085"
      - "7086:7086"
    volumes:
      - ../docker/identity-hub/config/configuration-consumer.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/consumer:/app/credentials/consumer:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - consumer-connector
      - consumer-ih-vault

  consumer-keycloak:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-provider:${IMAGE_TAG}
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: consumer-keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: edc
      KC_HOSTNAME: http://localhost:48082
      KC_HOSTNAME_ADMIN: http://localhost:48082
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'false'
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: edc
      KEYCLOAK_FRONTEND_URL: http://consumer-keycloak:8080
      KC_CACHE: local
    depends_on:
      - consumer-keycloak-postgres
    ports:
      - "48082:8080"

  consumer-keycloak-postgres:
    image: registry.paas.psnc.pl/bitnami/postgresql:17.6.0
    restart: always
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: keycloak
    ports:
      - '5451:5432'
    volumes:
      - 'consumer-keycloak-postgresql:/bitnami/postgresql'

  consumer-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5450:5432'
    volumes:
      - 'consumer-postgresql:/bitnami/postgresql'

  consumer-ih-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5452:5432'
    volumes:
      - 'consumer-ih-postgresql:/bitnami/postgresql'

  consumer-ih-vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_API_ADDR: "http://localhost:8200"
      VAULT_ADDR: "http://localhost:8200"
    volumes:
      - consumer-ih-vault:/vault/file
      - ../docker/identity-hub/kv/vault.hcl:/vault/config/vault.hcl:ro
    command: vault server -config=/vault/config/vault.hcl
    ports:
      - "8202:8200"

  consumer-backend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/consumer-backend:${IMAGE_TAG}
    ports:
      - "4000:4000"
    environment:
      MINIO_ENDPOINT: "minio:9001"
      MINIO_ACCESS_KEY: minio-user
      MINIO_SECRET_KEY: minio-password
    depends_on:
      - minio

  minio:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/minio:${IMAGE_TAG}
    command: server /storage --address :9001
    environment:
      - HOSTNAME=minio
      - MINIO_ACCESS_KEY=minio-user
      - MINIO_SECRET_KEY=minio-password
      - MINIO_IS_SECURE=False
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  consumer-postgresql:
    driver: local
  consumer-keycloak-postgresql:
    driver: local
  consumer-ih-postgresql:
    driver: local
  consumer-ih-vault:
    driver: local
  
