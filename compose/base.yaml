services:

  # registration-service-frontend:
  #   image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/registration-service-frontend:${IMAGE_TAG}
  #   ports:
  #     - "38080:80"
  #   volumes:
  #       - ../docker/registration-service-frontend/config/app.nginx.conf:/etc/nginx/nginx.conf
  #       - ../docker/registration-service-frontend/config/app.config.json:/usr/share/nginx/html/assets/config/app.config.json
  #   user: "root"
  #   depends_on:
  #     - registration-service

  data-space-portal:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-space-portal:${IMAGE_TAG}
    ports:
      - "38081:80"
    volumes:
        - ../docker/data-space-portal/config/app.nginx.conf:/etc/nginx/nginx.conf
        - ../docker/data-space-portal/config/app.config.json:/usr/share/nginx/html/assets/config/app.config.json
    user: "root"
    depends_on:
      - data-space-hub

  data-space-hub:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-space-hub:${IMAGE_TAG}
    volumes:
      - ../docker/data-space-hub/config/configuration.properties:/app/.env:ro
    ports:
      - "8000:8000"
    depends_on:
      - data-space-hub-postgres
      - data-space-hub-keycloak
      - dsh-vault
    entrypoint: "./entrypoint.sh"

  federated-catalog:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/federated-catalog:${IMAGE_TAG}
    volumes:
      - ../docker/federated-catalog/config/configuration.properties:/app/configuration.properties:ro
      - ../docker/federated-catalog/config/participants.json:/app/config/participants.json
      - 'federated-catalog-postgresql:/bitnami/postgresql'
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - federated-catalog-postgres
      - fc-vault
      - provider-connector
    ports:
      - "8290:8290"
      - "8291:8291"
      - "8292:8292"
      - "8293:8293"
      - "8294:8294"
      - "8295:8295"
      - "13001:13001"

  data-source:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-source:${IMAGE_TAG}
    ports:
      - "5000:5000"

  rs-vault:
    image: hashicorp/vault:1.17
    container_name: dsh-vault
    restart: always
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:7200"
    ports:
      - "7200:7200"
    command: >
      server -dev
      -dev-root-token-id=root
      -dev-listen-address=0.0.0.0:7200
    # optional: keep a file volume for any exports you do
    volumes:
      - 'data-space-hub-vault:/vault/file'
  
  fc-vault:
    image: hashicorp/vault:1.17
    container_name: fc-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    command: >
      server -dev
      -dev-root-token-id=root
      -dev-listen-address=0.0.0.0:8200
    # optional: keep a file volume for any exports you do
    volumes:
      - 'federated-catalog-vault:/vault/file'

  dataspace-issuer:
    image: nginx:latest
    ports:
      - "9876:80"
    volumes:
      - ../docker/issuer-service/assets/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/issuer-service/assets/did.k8s.json:/var/www/.well-known/did.json:ro

  issuer-service-admin:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/issuer-service:${IMAGE_TAG}
    ports:
      - "10010:10010"
      - "10011:10011"
      - "10012:10012"
      - "10013:10013"
      - "10014:10014"
      - "10015:10015"
    volumes:
      - ../docker/issuer-service/config/configuration.properties:/app/configuration.properties:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties

  fc-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7100:7100"
      - "7101:7101"
      - "7102:7102"
      - "7103:7103"
      - "7105:7105"
      - "7106:7106"
    volumes:
      - ../docker/identity-hub/config/configuration-fc.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/federated-catalog:/app/credentials/federated-catalog:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - federated-catalog

  consumer-backend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/consumer-backend:${IMAGE_TAG}
    ports:
      - "4000:4000"
    environment:
      MINIO_ENDPOINT: "minio:9001"
      MINIO_ACCESS_KEY: minio-user
      MINIO_SECRET_KEY: minio-password
    depends_on:
      - minio

  minio:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/minio:${IMAGE_TAG}
    command: server /storage --address :9001
    environment:
      - HOSTNAME=minio
      - MINIO_ACCESS_KEY=minio-user
      - MINIO_SECRET_KEY=minio-password
      - MINIO_IS_SECURE=False
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  data-space-hub-keycloak:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-provider:${IMAGE_TAG}
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: data-space-hub-keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: edc
      KC_HTTP_PORT: '48081'
      KC_HOSTNAME_URL: http://localhost:48081
      KC_HOSTNAME_ADMIN_URL: http://localhost:48081
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: edc
      KEYCLOAK_FRONTEND_URL: http://data-space-hub-keycloak:48081
    depends_on:
      - data-space-hub-keycloak-postgres
    ports:
      - "48081:48081"

  data-space-hub-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5436:5432'
    volumes:
      - 'data-space-hub-postgresql:/bitnami/postgresql'

  federated-catalog-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5435:5432'
    volumes:
      - 'federated-catalog-postgresql:/bitnami/postgresql'

  data-space-hub-keycloak-postgres:
    image: docker.io/bitnami/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: keycloak
    ports:
      - '5434:5432'
    volumes:
      - 'data-space-hub-keycloak-postgresql:/bitnami/postgresql'

volumes:
  registation-service-vault:
    driver: local
  federated-catalog-vault:
    driver: local
  data-space-hub-vault:
    driver: local
  data-space-hub-postgresql:
    driver: local
  federated-catalog-postgresql:
    driver: local
  data-space-hub-keycloak-postgresql:
    driver: local
