version: '3.8'

services:

  registration-service-frontend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/registration-service-frontend:${IMAGE_TAG}
    ports:
      - "38080:80"
    volumes:
        - ../docker/registration-service-frontend/config/app.nginx.conf:/etc/nginx/nginx.conf
        - ../docker/registration-service-frontend/config/app.config.json:/usr/share/nginx/html/assets/config/app.config.json
    user: "root"
    depends_on:
      - registration-service-backend

  registration-service-backend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/registration-service-backend:${IMAGE_TAG}
    volumes:
      - ../docker/registration-service-backend/config/configuration.properties:/app/configuration.properties:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    ports:
      - "38181:8181"
      - "38182:8182"
    depends_on:
      - registration-service-postgres
      - identity-provider

  registration-service-postgres:
    image: registry.paas.psnc.pl/base/bitnamilegacy/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5435:5432'
    volumes:
      - 'registration-service-postgresql:/bitnami/postgresql'

  federated-catalog:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/federated-catalog:${IMAGE_TAG}
    volumes:
      - ../docker/federated-catalog/config/configuration-dcp.properties:/app/configuration.properties:ro
      - ../docker/federated-catalog/config/participants.json:/app/config/participants.json
    environment:
      EDC_FS_CONFIG: /app/configuration.properties

    ports:
      - "8290:8290"
      - "8291:8291"
      - "8292:8292"
      - "8293:8293"
      - "8294:8294"
      - "8295:8295"
      - "13001:13001"
    depends_on:
      - provider-connector

  data-source:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-source:${IMAGE_TAG}
    ports:
      - "5000:5000"

  provider-dashboard:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-dashboard:${IMAGE_TAG}
    ports:
      - "18080:80"
    volumes:
      - ../docker/data-dashboard/config/conf-provider/provider.nginx.conf:/etc/nginx/nginx.conf
      - ../docker/data-dashboard/config/conf-provider/provider.config.json:/usr/share/nginx/html/assets/config/app.config.json
    user: "root"
    depends_on:
      - provider-connector

  provider-connector:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/connector:${IMAGE_TAG}
    ports:
      - "8190:8190"
      - "8191:8191"
      - "8192:8192"
      - "8193:8193"
      - "8194:8194"
      - "8195:8195"
      - "12001:12001"
    volumes:
      - ../docker/connector/config/configuration-provider-dcp.properties:/app/configuration.properties:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    user: "root"
    depends_on:
      - provider-postgres
      - identity-provider

  provider-postgres:
    image: registry.paas.psnc.pl/base/bitnamilegacy/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5432:5432'
    volumes:
      - 'provider-postgresql:/bitnami/postgresql'

  fc-vault:
    image: hashicorp/vault:1.17
    container_name: fc-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    command: >
      server -dev
      -dev-root-token-id=root
      -dev-listen-address=0.0.0.0:8200
    # optional: keep a file volume for any exports you do
    volumes:
      - ./vault-data:/vault/file
  
  consumer-vault:
    image: hashicorp/vault:1.17
    container_name: consumer-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:9200"
    ports:
      - "9200:9200"
    command: >
      server -dev
      -dev-root-token-id=root
      -dev-listen-address=0.0.0.0:9200
    # optional: keep a file volume for any exports you do
    volumes:
      - ./vault-data:/vault/file

  provider-vault:
    image: hashicorp/vault:1.17
    container_name: provider-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:10200"
    ports:
      - "10200:10200"
    command: >
      server -dev
      -dev-root-token-id=root
      -dev-listen-address=0.0.0.0:10200
    # optional: keep a file volume for any exports you do
    volumes:
      - ./vault-data:/vault/file    

  dataspace-issuer:
    image: nginx:latest
    ports:
      - "9876:80"
    volumes:
      - ../docker/issuer-service/assets/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/issuer-service/assets/did.k8s.json:/var/www/.well-known/did.json:ro

  issuer-service-admin:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/issuer-service:${IMAGE_TAG}
    ports: 
      - "10010:10010"
      - "10011:10011"
      - "10012:10012"
      - "10013:10013"
      - "10014:10014"
      - "10015:10015"
    volumes:
      - ../docker/issuer-service/config/configuration.properties:/app/configuration.properties:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties

  fc-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7100:7100"
      - "7101:7101"
      - "7102:7102"
      - "7103:7103"
      - "7105:7105"
      - "7106:7106"
    volumes:
      - ../docker/identity-hub/config/configuration-fc.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/federated-catalog:/app/credentials/federated-catalog:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - federated-catalog

  provider-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7090:7090"
      - "7091:7091"
      - "7092:7092"
      - "7093:7093"
      - "7095:7095"
      - "7096:7096"
    volumes:
      - ../docker/identity-hub/config/configuration-provider.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/provider:/app/credentials/provider:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - provider-connector
  
  consumer-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7080:7080"
      - "7081:7081"
      - "7082:7082"
      - "7083:7083"
      - "7085:7085"
      - "7086:7086"
    volumes:
      - ../docker/identity-hub/config/configuration-consumer.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/consumer:/app/credentials/consumer:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      - consumer-connector

  consumer-dashboard:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-dashboard:${IMAGE_TAG}
    ports:
      - "28080:80"
    volumes:
      - ../docker/data-dashboard/config/conf-consumer/consumer.nginx.conf:/etc/nginx/nginx.conf
      - ../docker/data-dashboard/config/conf-consumer/consumer.config.json:/usr/share/nginx/html/assets/config/app.config.json
    user: "root"
    depends_on:
      - consumer-connector

  consumer-connector:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/connector:${IMAGE_TAG}
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
      - "11001:11001"
    volumes:
      - ../docker/connector/config/configuration-consumer-dcp.properties:/app/configuration.properties:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    user: "root"
    depends_on:
      - consumer-postgres
      - identity-provider

  consumer-postgres:
    image: registry.paas.psnc.pl/base/bitnamilegacy/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5433:5432'
    volumes:
      - 'consumer-postgresql:/bitnami/postgresql'

  consumer-backend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/consumer-backend:${IMAGE_TAG}
    ports:
      - "4000:4000"
    environment:
      MINIO_ENDPOINT: "minio:9001"
      MINIO_ACCESS_KEY: minio-user
      MINIO_SECRET_KEY: minio-password
    depends_on:
      - minio

  minio:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/minio:${IMAGE_TAG}
    command: server /storage --address :9001
    environment:
      - HOSTNAME=minio
      - MINIO_ACCESS_KEY=minio-user
      - MINIO_SECRET_KEY=minio-password
      - MINIO_IS_SECURE=False
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  identity-provider:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-provider:${IMAGE_TAG}
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: identity-provider-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: edc
      KC_HTTP_PORT: '48081'
      KC_HOSTNAME_URL: http://localhost:48081
      KC_HOSTNAME_ADMIN_URL: http://localhost:48081
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: edc
      KEYCLOAK_FRONTEND_URL: http://identity-provider:48081
    depends_on:
      - identity-provider-postgres
    ports:
      - "48081:48081"

  identity-provider-postgres:
    image: registry.paas.psnc.pl/base/bitnamilegacy/postgresql:11
    restart: always
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: keycloak
    ports:
      - '5434:5432'
    volumes:
      - 'identity-provider-postgresql:/bitnami/postgresql'

volumes:
  consumer-postgresql:
    driver: local
  provider-postgresql:
    driver: local
  identity-provider-postgresql:
    driver: local
  registration-service-postgresql:
    driver: local
