services:
  mail-service:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/mail-service:${IMAGE_TAG}
    ports:
      - "5555:5555"
    volumes:
      - ../docker/mail-service/config/configuration.properties:/app/.env:ro

  federated-catalog:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/federated-catalog:${IMAGE_TAG}
    volumes:
      - ./.generated/docker/federated-catalog/config/configuration.properties:/app/configuration.properties:ro
      - 'federated-catalog-postgresql:/bitnami/postgresql'
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      federated-catalog-postgres:
        condition: service_healthy
      provider-connector:
        condition: service_started
      consumer-connector:
        condition: service_started
      fc-ih:
        condition: service_started
    ports:
      - "8290:8290"
      - "8291:8291"
      - "8292:8292"
      - "8293:8293"
      - "8294:8294"
      - "8295:8295"
      - "8296:8296"
      - "13001:13001"

  fc-ih:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-hub:${IMAGE_TAG}
    ports:
      - "7100:7100"
      - "7101:7101"
      - "7102:7102"
      - "7103:7103"
      - "7105:7105"
      - "7106:7106"
    volumes:
      - ./.generated/docker/identity-hub/config/configuration-fc.properties:/app/configuration.properties:ro
      - ../docker/identity-hub/credentials/federated-catalog:/app/credentials/federated-catalog:ro
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    depends_on:
      federated-catalog-ih-postgres:
        condition: service_healthy
      fc-ih-vault:
        condition: service_healthy
  
  federated-catalog-postgres:
    image: registry.paas.psnc.pl/bitnami/postgresql:17.6.0
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRESQL_USERNAME" -d "$$POSTGRESQL_DATABASE"
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - '5435:5432'
    volumes:
      - 'federated-catalog-postgresql:/bitnami/postgresql'

  federated-catalog-ih-postgres:
    image: registry.paas.psnc.pl/bitnami/postgresql:17.6.0
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRESQL_USERNAME" -d "$$POSTGRESQL_DATABASE"
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - '5462:5432'
    volumes:
      - 'fc-ih-postgresql:/bitnami/postgresql'

  data-space-portal:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-space-portal:${IMAGE_TAG}
    ports:
      - "38081:80"
    volumes:
      - ../docker/data-space-portal/config/app.config.json:/usr/share/nginx/html/app.config.json:ro
      - ../docker/data-space-portal/config/app.nginx.conf:/etc/nginx/nginx.conf
    user: "root"   
    depends_on:
      data-space-hub:
        condition: service_started

  data-space-hub:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-space-hub:${IMAGE_TAG}
    volumes:
      - ./.generated/docker/data-space-hub/config/config.properties:/app/.env:ro
    depends_on:
      data-space-hub-postgres:
        condition: service_healthy
      data-space-hub-vault:
        condition: service_healthy
      vault-unseal:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    entrypoint: "./entrypoint.sh" 

  data-space-hub-postgres:
    image: registry.paas.psnc.pl/bitnami/postgresql:17.6.0
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRESQL_USERNAME" -d "$$POSTGRESQL_DATABASE"
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - '5436:5432'
    volumes:
      - 'data-space-hub-postgres:/bitnami/postgresql'

  data-space-hub-vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_API_ADDR: "http://localhost:8200"
      VAULT_ADDR: "http://localhost:8200"
    volumes:
      - dsh-ih-vault:/vault/file
      - ../docker/identity-hub/kv/vault.hcl:/vault/config/vault.hcl:ro
    command: vault server -config=/vault/config/vault.hcl
    healthcheck:
      test:
        - CMD-SHELL
        - vault status -address=http://127.0.0.1:8200 2>/dev/null | grep -Eq 'Initialized[[:space:]]+true' && vault status -address=http://127.0.0.1:8200 2>/dev/null | grep -Eq 'Sealed[[:space:]]+false'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - "8200:8200"

  fc-ih-vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_API_ADDR: "http://localhost:8200"
      VAULT_ADDR: "http://localhost:8200"
    volumes:
      - fc-ih-vault:/vault/file
      - ../docker/identity-hub/kv/vault.hcl:/vault/config/vault.hcl:ro
    command: vault server -config=/vault/config/vault.hcl
    healthcheck:
      test:
        - CMD-SHELL
        - vault status -address=http://127.0.0.1:8200 2>/dev/null | grep -Eq 'Initialized[[:space:]]+true' && vault status -address=http://127.0.0.1:8200 2>/dev/null | grep -Eq 'Sealed[[:space:]]+false'
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - "8201:8200"

  vault-unseal:
    image: alpine:3.23
    depends_on:
      data-space-hub-vault:
        condition: service_started
      provider-ih-vault:
        condition: service_started
      consumer-ih-vault:
        condition: service_started
      fc-ih-vault:
        condition: service_started
    environment:
      DSH_VAULT_ADDR: http://data-space-hub-vault:8200
      PROVIDER_VAULT_ADDR: http://provider-ih-vault:8200
      CONSUMER_VAULT_ADDR: http://consumer-ih-vault:8200
      FC_VAULT_ADDR: http://fc-ih-vault:8200
    volumes:
      - ../bin/vault-init-unseal.sh:/work/vault-init-unseal.sh:ro
      - ../compose/vaults.json:/work/vaults.json:ro
      - ../bin/secrets:/work/secrets
    entrypoint: /bin/sh
    command: >
      -c "
        apk add --no-cache bash curl jq >/dev/null;
        /work/vault-init-unseal.sh;
      "

  data-space-keycloak:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-provider:${IMAGE_TAG}
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: data-space-keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: edc
      KC_HOSTNAME: http://localhost:48081
      KC_HOSTNAME_ADMIN: http://localhost:48081
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'false'
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: edc
      KEYCLOAK_FRONTEND_URL: http://data-space-keycloak:8080
      KC_CACHE: local
    depends_on:
      data-space-keycloak-postgres:
        condition: service_healthy
    ports:
      - "48081:8080"

  data-space-keycloak-postgres:
    image: registry.paas.psnc.pl/bitnami/postgresql:17.6.0
    restart: always
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: keycloak
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRESQL_USERNAME" -d "$$POSTGRESQL_DATABASE"
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - '5461:5432'
    volumes:
      - 'data-space-hub-keycloak-postgres:/bitnami/postgresql'

  consumer-backend:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/consumer-backend:${IMAGE_TAG}
    ports:
      - "4000:4000"
    environment:
      S3_ENDPOINT_URL: "http://storage:9000"
      S3_ACCESS_KEY: rustfs-admin
      S3_SECRET_KEY: rustfs
      S3_BUCKET: downloads
      S3_DEFAULT_PREFIX: edc-transfers
      S3_DEFAULT_FOLDER: anonymous
    depends_on:
      - storage

  storage:
    image: rustfs/rustfs:1.0.0-alpha.85 # ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/storage:${IMAGE_TAG}
    environment:
      - HOSTNAME=storage
      - RUSTFS_ACCESS_KEY=rustfs-admin
      - RUSTFS_SECRET_KEY=rustfs
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - storage-data:/data

volumes:
  data-space-hub-postgres:
    driver: local
  dsh-ih-vault:
    driver: local
  fc-ih-postgresql:
    driver: local
  federated-catalog-postgresql:
    driver: local
  fc-ih-vault:
    driver: local
  data-space-hub-keycloak-postgres:
    driver: local
  storage-data:
    driver: local
