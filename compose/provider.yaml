services:
  provider-postgres:
    image: registry.paas.psnc.pl/bitnami/postgresql:17.6.0
    restart: always
    environment:
      POSTGRESQL_USERNAME: edc
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: edc
    ports:
      - '5432:5432'
    volumes:
      - 'provider-postgresql:/bitnami/postgresql'

  provider-keycloak-postgres:
    image: registry.paas.psnc.pl/bitnami/postgresql:17.6.0
    restart: always
    environment:
      POSTGRESQL_USERNAME: keycloak
      POSTGRESQL_PASSWORD: edc
      POSTGRESQL_DATABASE: keycloak
    ports:
      - '5443:5432'
    volumes:
      - 'provider-keycloak-postgresql:/bitnami/postgresql'

  provider-keycloak:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/identity-provider:${IMAGE_TAG}
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: provider-keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: edc
      KC_HOSTNAME: http://localhost:8083
      KC_HOSTNAME_ADMIN: http://localhost:8083
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'false'
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: edc
      KEYCLOAK_FRONTEND_URL: http://provider-keycloak:8080
    depends_on:
      - provider-keycloak-postgres
    ports:
      - "8083:8080"

  provider-connector:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/connector:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "19191:19191"
      - "19193:19193"
      - "19194:19194"
      - "19195:19195"
      - "19291:19291"
      - "19192:19192"
    volumes:
      - ../docker/connector/config/configuration-provider.properties:/app/configuration.properties:ro
      - ../docker/connector/certs/provider-daps.jks:/app/certs/provider-daps.jks
    environment:
      EDC_FS_CONFIG: /app/configuration.properties
    user: "root"
    depends_on:
      - provider-postgres
      - provider-keycloak
  provider-dashboard:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/data-dashboard:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ../docker/data-dashboard/config/conf-provider/provider.nginx.conf:/etc/nginx/nginx.conf
      - ../docker/data-dashboard/config/conf-provider/provider.config.json:/usr/share/nginx/html/assets/config/app.config.json
    user: "root"
    depends_on:
      - provider-connector

  provider-idp-filler:
    image: ${REGISTRY_DOMAIN}/${REGISTRY_PROJECT}/${REGISTRY_APPLICATION}/idp-filler:${IMAGE_TAG}
    restart: no
    tty: true
    environment:
      RUN_SCRIPT: 1
      IDP_MODE: organization
      KC_BASE: http://provider-keycloak:8080
      KC_USER: admin
      KC_PASS: edc
      RS_USERNAME: psnc
      RS_PASSWORD: edc
    # Use image's default Python entrypoint
    depends_on:
      - provider-keycloak

volumes:
  provider-postgresql:
    driver: local
  provider-keycloak-postgresql:
    driver: local
