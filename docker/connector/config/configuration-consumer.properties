edc.connector.name=consumer
edc.participant.id=did:web:localhost%3A7083
edc.hostname=consumer-connector
edc.dsp.callback.address=http://consumer-connector:29194/protocol
web.http.port=29191
web.http.path=/api
web.http.control.port=29192
web.http.control.path=/control
web.http.management.port=29193
web.http.management.path=/management
web.http.protocol.port=29194
web.http.protocol.path=/protocol

edc.catalog.proxy.dsp.enabled=false
# Catalog proxy API (separate web context)
web.http.catalogproxy.port=29195
web.http.catalogproxy.path=/catalog-proxy
# Authentication for catalog-proxy API (same mechanism as management)
web.http.catalogproxy.auth.type=composite
# tokenbased - api-key, delegated - oauth2/daps
web.http.catalogproxy.auth.includes=["tokenbased", "delegated"]
web.http.catalogproxy.auth.context=catalogproxy
web.http.catalogproxy.auth.key=edc
web.http.catalogproxy.auth.dac.key.url=http://consumer-keycloak:8080/realms/Organizations/protocol/openid-connect/certs
web.http.catalogproxy.auth.audience=["federated-catalog", "consumer-connector"]
web.http.catalogproxy.auth.roles=["access-catalog"]
# Only if needed: Audience validation config for delegated auth
# web.http.catalogproxy.auth.dac.audience=["federated-catalog", "consumer-connector"]

# Catalog proxy -> Federated Catalog settings (DSP-first, then HTTP fallback)
edc.catalog.proxy.dsp.counterparty.address=http://federated-catalog:8182/catalog
edc.catalog.proxy.dsp.counterparty.id=federated-catalog
edc.catalog.proxy.dsp.protocol=dataspace-protocol-http
edc.catalog.proxy.http.target.url=http://federated-catalog:8181/catalog/v1alpha/catalog/query
edc.catalog.proxy.http.apikey.header=x-api-key
edc.catalog.proxy.http.apikey=edc
edc.receiver.http.endpoint=http://consumer-backend:4000/edr-endpoint
web.http.public.port=29291
web.http.public.path=/public
edc.receiver.http.endpoint=http://consumer-backend:4000/edr-endpoint
edc.dataplane.token.validation.endpoint=http://localhost:29192/control/token

edc.public.key.alias=dapsPublic
edc.transfer.dataplane.token.signer.privatekey.alias=dapsPrivate
edc.transfer.proxy.token.signer.privatekey.alias=dapsPrivate
edc.transfer.proxy.token.verifier.publickey.alias=dapsPublic

edc.web.rest.cors.enabled=true
edc.web.rest.cors.headers=origin,content-type,accept,authorization,x-api-key

edc.dataplane.token.validation.endpoint=http://consumer-connector:29192/control/token

# Authentication (tokenbased, delegated, composite, none)
web.http.management.auth.type=composite
web.http.management.auth.includes=["tokenbased", "delegated"]
web.http.management.auth.context=management-api
web.http.management.auth.key=edc
web.http.management.auth.dac.key.url=http://consumer-keycloak:8080/realms/Organizations/protocol/openid-connect/certs
edc.api.auth.dac.key.url=http://consumer-keycloak:8080/realms/Organizations/protocol/openid-connect/certs
# Audience validation config (try multiple legacy/variants to ensure coverage)
web.http.management.auth.audience=consumer-connector
web.http.management.auth.dac.audience=consumer-connector

web.http.control.auth.type=tokenbased
web.http.control.auth.context=control-api
web.http.control.auth.key=edc

web.http.default.auth.type=tokenbased
web.http.default.auth.context=default-api
web.http.default.auth.key=edc

# OAuth2 (DAPS) /protocol
psnc.connector.daps.keystore.file.path=certs/consumer-daps.jks
psnc.connector.daps.keystore.password=1234

edc.oauth.provider.jwks.url = http://data-space-keycloak:8080/realms/DAPS/protocol/openid-connect/certs
edc.oauth.token.url = http://data-space-keycloak:8080/realms/DAPS/protocol/openid-connect/token
edc.oauth.client.id = consumer
edc.oauth.certificate.alias = dapsPublic
edc.oauth.private.key.alias = dapsPrivate
edc.oauth.provider.audience = http://localhost:8081/realms/DAPS/protocol/openid-connect/token
edc.oauth.endpoint.audience = idsc:IDS_CONNECTORS_ALL
edc.agent.identity.key = client_id
edc.iam.token.scope = idsc:IDS_CONNECTOR_ATTRIBUTES_ALL

