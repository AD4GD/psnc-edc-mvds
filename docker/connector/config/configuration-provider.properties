# control plane specific config
edc.iam.issuer.id=did:web:provider-ih%3A7093:bob
web.http.port=8190
web.http.path=/api
web.http.management.port=8191
web.http.management.path=/api/management/
web.http.protocol.port=8192
web.http.protocol.path=/api/dsp
web.http.control.port=8193
web.http.control.path=/api/control
web.http.catalog.port=8194
web.http.catalog.path=/api/catalog
web.http.version.port=8195
web.http.version.path=/api/version
edc.iam.did.web.use.https=false
edc.iam.sts.privatekey.alias=key-1
edc.iam.sts.publickey.id=did:web:provider-ih%3A7093:bob#key-1

edc.dsp.callback.address=http://provider-connector:8192/api/dsp
edc.participant.id=did:web:provider-ih%3A7093:bob
edc.management.context.enabled=true
edc.iam.sts.oauth.client.secret.alias=did:web:provider-ih%3A7093:bob-sts-client-secret
edc.iam.sts.oauth.client.id=did:web:provider-ih%3A7093:bob
edc.iam.sts.oauth.token.url=http://provider-ih:7096/api/sts/token

edc.catalog.proxy.dsp.enabled=false
# Catalog proxy API (separate web context)
web.http.catalogproxy.port=8196
web.http.catalogproxy.path=/api/catalog-proxy
# Authentication for catalog-proxy API (same mechanism as management)
web.http.catalogproxy.auth.type=composite
web.http.catalogproxy.auth.includes=["tokenbased", "delegated"]
web.http.catalogproxy.auth.context=catalogproxy-api
web.http.catalogproxy.auth.key=edc
web.http.catalogproxy.auth.dac.key.url=http://provider-keycloak:8080/realms/Organizations/protocol/openid-connect/certs
web.http.catalogproxy.auth.audience=["federated-catalog", "provider-connector"]
web.http.catalogproxy.auth.roles=["access-catalog"]
# Audience validation config for delegated auth
# web.http.catalogproxy.auth.dac.audience=federated-catalog

# Catalog proxy -> Federated Catalog settings (DSP-first, then HTTP fallback)
edc.catalog.proxy.dsp.counterparty.address=http://federated-catalog:8294/api/catalog
edc.catalog.proxy.dsp.counterparty.id=federated-catalog
edc.catalog.proxy.dsp.protocol=dataspace-protocol-http
edc.catalog.proxy.http.target.url=http://federated-catalog:8294/api/catalog/v1alpha/catalog/query
edc.catalog.proxy.http.apikey.header=x-api-key
edc.catalog.proxy.http.apikey=password

# control plane auth (tokenbased, delegated, composite, none)
web.http.auth.type=composite
web.http.auth.includes=["tokenbased", "delegated"]
web.http.auth.key=password
web.http.auth.dac.key.url=http://provider-keycloak:8080/realms/Organizations/protocol/openid-connect/certs

web.http.management.auth.type=composite
web.http.management.auth.includes=["tokenbased", "delegated"]
web.http.management.auth.key=password
web.http.management.auth.dac.key.url=http://provider-keycloak:8080/realms/Organizations/protocol/openid-connect/certs
web.http.management.auth.audience=provider-connector
web.http.management.auth.dac.audience=provider-connector

web.http.control.auth.type=tokenbased
web.http.control.auth.key=password

# dataplane specific config
edc.transfer.proxy.token.verifier.publickey.alias=did:web:provider-ih%3A7093:bob#key-1
edc.transfer.proxy.token.signer.privatekey.alias=key-1
edc.dpf.selector.url=http://provider-connector:8193/api/control/v1/dataplanes
web.http.public.port=12001
web.http.public.path=/api/public

# CORS
edc.web.rest.cors.enabled=true
edc.web.rest.cors.headers=origin,content-type,accept,authorization,x-api-key

# persistence
edc.sql.schema.autocreate=true
edc.datasource.default.url = jdbc:postgresql://provider-postgres:5432/edc
edc.datasource.default.user = edc
edc.datasource.default.password = edc
edc.vault.hashicorp.url=http://provider-ih-vault:8200
edc.vault.hashicorp.token=<set-in-bin-env-secrets>
edc.vault.hashicorp.token.ttl=0
edc.vault.hashicorp.token.scheduled-renew-enabled=false

# iShare
ishare.pr.url=https://isharesat-mw.pir.test.ishareworks.nl/
ishare.client.id=NTRPL-PCSSPROVIDER1
# DID or EORI of the Participant Registry — used as aud in JWT client assertions
# Obtain from PR documentation or by calling GET /participants/{id}
ishare.pr.id=did:ishare:EU.NL.NTRNL-TESTPIRSAT1
# Secret names in Hashicorp Vault (set via: vault kv put secret/<name> content=@file.pem)
ishare.vault.key.secret=ishare-private-key
ishare.vault.cert.secret=ishare-certificate-chain
ishare.auto.init=true